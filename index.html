<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080808">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="mat-hub">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>mat-hub</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* reset */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

/* kolory i zmienne */
:root {
  --tlo:       #080808;
  --powierzchnia1: #161616;
  --powierzchnia2: #1e1e1e;
  --powierzchnia3: #262626;
  --ramka1:    #2c2c2c;
  --ramka2:    #3a3a3a;
  --tekst1:    #dedede;
  --tekst2:    #888;
  --tekst3:    #484848;
  --akcent:    #c8c8c8;
  --zielony:   #4ade80;
  --czerwony:  #f87171;
  --zolty:     #d4a017;
}

html { background: var(--tlo); }

body {
  font-family: 'DM Sans', sans-serif;
  color: var(--tekst1);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* ==========================================
   EKRANY NAKŁADKOWE (menu, wyniki)
   ========================================== */
.ekran {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: var(--tlo);
  padding: 48px 24px 32px;
  overflow-y: auto;
  /* tytuł na górze, środek elastyczny, graj na dole */
  justify-content: space-between;
}
.ekran.ukryty { display: none; }

/* tytuł mat-hub */
.tytul {
  font-family: 'DM Mono', monospace;
  font-size: clamp(38px, 12vw, 58px);
  font-weight: 500;
  text-align: center;
  letter-spacing: -0.03em;
}

/* środkowa część menu (lista trybów + opcje) */
.menu-srodek {
  width: 100%;
  max-width: 340px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  flex: 1;
  justify-content: center;
  padding: 16px 0;
}

/* przycisk Graj na dole */
.menu-dol {
  width: 100%;
  max-width: 340px;
}

/* ==========================================
   LISTA TRYBÓW GRY
   ========================================== */
.lista-trybow {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
}

.tryb {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--powierzchnia1);
  border: 1.5px solid var(--ramka1);
  border-radius: 12px;
  padding: 13px 16px;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  transition: border-color 0.12s, background 0.12s;
}
.tryb.aktywny { border-color: var(--akcent); background: rgba(200,200,200,0.06); }
.tryb:active  { opacity: 0.7; }

.tryb-ikona {
  font-family: 'DM Mono', monospace;
  font-size: 15px;
  width: 34px;
  text-align: center;
  flex-shrink: 0;
  color: var(--tekst2);
}
.tryb.aktywny .tryb-ikona { color: var(--akcent); }
.tryb-nazwa { font-size: 14px; font-weight: 600; color: var(--tekst1); }

/* ==========================================
   BLOKI KONFIGURACJI (działania, poziom)
   ========================================== */
.blok {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  width: 100%;
}
.blok-etykieta {
  font-size: 10px;
  color: var(--tekst3);
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
.rzad { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; }

/* pigułki poziomu */
.pigulka {
  background: var(--powierzchnia1);
  border: 1.5px solid var(--ramka1);
  border-radius: 100px;
  padding: 7px 18px;
  font-size: 13px;
  color: var(--tekst2);
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  transition: border-color 0.12s, color 0.12s;
}
.pigulka.aktywny { border-color: var(--akcent); color: var(--akcent); background: rgba(200,200,200,0.07); }
.pigulka:active  { opacity: 0.65; }

/* przyciski działań (+, −, ×, ÷) */
.przycisk-dzialania {
  background: var(--powierzchnia1);
  border: 1.5px solid var(--ramka1);
  border-radius: 10px;
  width: 54px; height: 46px;
  font-family: 'DM Mono', monospace;
  font-size: 21px;
  color: var(--tekst2);
  cursor: pointer;
  text-align: center;
  line-height: 46px;
  touch-action: manipulation;
  user-select: none;
  transition: border-color 0.12s, color 0.12s;
}
.przycisk-dzialania.aktywny { border-color: var(--akcent); color: var(--akcent); background: rgba(200,200,200,0.07); }
.przycisk-dzialania:active   { opacity: 0.65; }

/* gdy tryb działania nie jest wybrany, wyszarz opcje działań */
#opcje-dzialan.wyszarzony { opacity: 0.3; pointer-events: none; }

/* ==========================================
   PRZYCISKI OGÓLNE
   ========================================== */
.btn {
  background: #fff;
  color: #111;
  border: none;
  border-radius: 12px;
  padding: 14px 0;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  touch-action: manipulation;
  transition: opacity 0.12s, transform 0.1s;
  width: 100%;
}
.btn:active { opacity: 0.82; transform: scale(0.98); }

.btn.duch {
  background: none;
  border: 1.5px solid var(--ramka2);
  color: var(--tekst1);
  font-weight: 400;
}
.btn.duch:active { opacity: 0.6; }

/* ==========================================
   EKRAN WYNIKÓW
   ========================================== */
.siatka-wynikow {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  width: 100%;
  max-width: 310px;
}
.kafelek-wyniku {
  background: var(--powierzchnia1);
  border: 1.5px solid var(--ramka1);
  border-radius: 12px;
  padding: 14px;
  text-align: center;
}
.wartosc-wyniku {
  font-family: 'DM Mono', monospace;
  font-size: 30px;
  font-weight: 500;
  color: var(--tekst1);
  line-height: 1;
}
.etykieta-wyniku {
  font-size: 10px;
  color: var(--tekst3);
  letter-spacing: 0.1em;
  margin-top: 5px;
  text-transform: uppercase;
}
.koniec-srodek {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  width: 100%;
  max-width: 310px;
  flex: 1;
  justify-content: center;
}

/* ==========================================
   OBSZAR GRY (wrap)
   ========================================== */
.wrap {
  width: 100%;
  max-width: 440px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  padding: 16px;
}

/* nagłówek gry: punkty | combo | przycisk menu */
.naglowek {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.punkty {
  font-family: 'DM Mono', monospace;
  font-size: 23px;
  font-weight: 500;
  color: var(--tekst1);
}
.combo {
  flex: 1;
  text-align: center;
  font-size: 11px;
  color: var(--akcent);
  opacity: 0;
  transition: opacity 0.2s;
  font-family: 'DM Mono', monospace;
}
.combo.widoczny { opacity: 1; }
.przycisk-menu {
  background: none;
  border: 1.5px solid var(--ramka1);
  border-radius: 8px;
  padding: 5px 13px;
  font-size: 11px;
  color: var(--tekst2);
  cursor: pointer;
  touch-action: manipulation;
}
.przycisk-menu:active { opacity: 0.55; }

/* rząd z kropkami streak */
.rzad-streak {
  display: flex;
  align-items: center;
  gap: 7px;
  min-height: 18px;
  flex-shrink: 0;
}
.kropki-streak { display: flex; gap: 4px; }
.kropka {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--powierzchnia2);
  border: 1.5px solid var(--ramka1);
  transition: background 0.18s, border-color 0.18s;
}
.kropka.aktywna { background: var(--zielony); border-color: var(--zielony); }

/* pasek timera combo */
.pasek-combo-wrap {
  flex: 1;
  height: 3px;
  background: var(--powierzchnia2);
  border-radius: 2px;
  overflow: hidden;
  margin: 0 4px;
}
.pasek-combo {
  height: 100%;
  width: 100%;
  border-radius: 2px;
  background: var(--akcent);
  transition: background 0.3s;
}
.pasek-combo.niski { background: var(--czerwony); }

/* ==========================================
   KARTA PYTANIA
   ========================================== */
.karta {
  background: var(--powierzchnia1);
  border: 1.5px solid var(--ramka1);
  border-radius: 16px;
  padding: 20px 18px 16px;
  text-align: center;
  position: relative;
  overflow: hidden;
  transition: border-color 0.18s;
}
.karta.trafiony  { border-color: var(--zielony); }
.karta.bledny    { border-color: var(--czerwony); animation: trząsienie 0.24s; }

@keyframes trząsienie {
  0%, 100% { transform: translateX(0); }
  30%       { transform: translateX(-6px); }
  70%       { transform: translateX(6px); }
}

.etykieta-pytania {
  font-size: 10px;
  color: var(--tekst3);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  margin-bottom: 10px;
}

/* pytanie arytmetyczne */
.pytanie-arytm {
  font-family: 'DM Mono', monospace;
  font-size: clamp(28px, 9.5vw, 50px);
  font-weight: 500;
  line-height: 1;
  color: var(--tekst1);
  letter-spacing: -0.02em;
}
.pytanie-arytm .operator  { color: var(--akcent); }
.pytanie-arytm .rowna-sie { color: var(--tekst3); }
.pytanie-arytm .odpowiedz { color: var(--zielony); transition: color 0.15s; }
.pytanie-arytm .placeholder { color: var(--tekst3); }

/* pytanie wielomianowe / wzory */
.pytanie-poly {
  font-family: 'DM Mono', monospace;
  font-size: clamp(18px, 5.5vw, 30px);
  font-weight: 500;
  color: var(--tekst1);
  line-height: 1.3;
}
sup { font-size: 0.58em; vertical-align: super; line-height: 0; }

.podpowiedz-iloczynowa {
  font-family: 'DM Mono', monospace;
  font-size: clamp(13px, 4vw, 20px);
  color: var(--tekst2);
  margin-top: 10px;
  line-height: 1.4;
}

/* pole do uzupełnienia w podpowiedzi */
.blank {
  display: inline-block;
  min-width: 20px;
  border-bottom: 1.5px solid var(--akcent);
  color: var(--akcent);
  text-align: center;
  padding: 0 2px;
  font-weight: 500;
}

/* ==========================================
   TRÓJKĄT PITAGORASA (SVG w karcie)
   ========================================== */
.trojkat-svg {
  width: 100%;
  max-width: 240px;
  margin: 8px auto 0;
  display: block;
}

/* animacja "pop" przy trafieniu/błędzie */
.pop-animacja {
  position: absolute;
  font-family: 'DM Mono', monospace;
  font-size: 19px;
  font-weight: 500;
  pointer-events: none;
  opacity: 0;
  z-index: 5;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  white-space: nowrap;
}

/* ==========================================
   POLA ODPOWIEDZI (x₁/x₂, a/b, c)
   ========================================== */
.rzad-pol {
  display: flex;
  gap: 5px;
  align-items: stretch;
  margin-bottom: 8px;
}
.taby-pol { display: flex; gap: 6px; margin-bottom: 5px; }

.tab-pola {
  flex: 1;
  background: var(--powierzchnia1);
  border: 1.5px solid var(--ramka1);
  border-radius: 8px;
  padding: 7px 0;
  font-size: 11px;
  color: var(--tekst2);
  cursor: pointer;
  text-align: center;
  touch-action: manipulation;
  user-select: none;
  transition: all 0.12s;
  font-family: 'DM Mono', monospace;
}
.tab-pola.aktywny { border-color: var(--akcent); color: var(--akcent); background: rgba(200,200,200,0.07); }
.tab-pola:active  { opacity: 0.65; }

.pole-odpowiedzi {
  flex: 1;
  min-width: 0;
  background: var(--powierzchnia2);
  border: 1.5px solid var(--ramka1);
  border-radius: 10px;
  padding: 9px 10px;
  cursor: pointer;
  touch-action: manipulation;
  display: flex;
  flex-direction: column;
  gap: 2px;
  transition: border-color 0.15s;
}
.pole-odpowiedzi.aktywny { border-color: var(--akcent); }

.etykieta-pola { font-size: 9px; color: var(--tekst3); letter-spacing: 0.1em; text-transform: uppercase; }

.wartosc-pola {
  font-family: 'DM Mono', monospace;
  font-size: clamp(16px, 5vw, 22px);
  font-weight: 500;
  color: var(--tekst1);
  text-align: right;
  min-height: 30px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
}
.wartosc-pola.placeholder { color: var(--tekst3); }

.separator-pol { align-self: center; color: var(--tekst3); font-size: 13px; flex-shrink: 0; padding: 0 1px; }

/* ==========================================
   KLAWIATURA NUMERYCZNA
   ========================================== */
.klawiatura {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  flex-shrink: 0;
}

.klawisz {
  background: var(--powierzchnia1);
  border: 1.5px solid var(--ramka1);
  border-radius: 10px;
  height: 52px;
  font-family: 'DM Mono', monospace;
  font-size: 17px;
  color: var(--tekst1);
  cursor: pointer;
  text-align: center;
  line-height: 52px;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  transition: background 0.07s, transform 0.07s;
}
.klawisz:active { transform: scale(0.9); background: var(--powierzchnia3); }

.klawisz.znak      { color: var(--zolty); }
.klawisz.kasowanie { color: var(--czerwony); }
.klawisz.szerokie  { grid-column: span 2; }
.klawisz.zatwierdz { background: #fff; color: #111; border-color: #fff; font-size: 19px; }
.klawisz.zatwierdz:active { background: #ccc; transform: scale(0.9); }
.klawisz.pominij   { font-size: 11px; color: var(--tekst3); letter-spacing: 0.04em; }
.klawisz.pominij:active { color: var(--tekst2); transform: scale(0.9); }

/* ==========================================
   TOAST (combo, komunikaty)
   ========================================== */
.toast {
  position: fixed;
  top: 24%;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'DM Mono', monospace;
  font-size: clamp(16px, 5vw, 24px);
  color: var(--akcent);
  opacity: 0;
  pointer-events: none;
  z-index: 60;
  white-space: nowrap;
}
@keyframes animacja-toast {
  0%   { opacity: 0; transform: translateX(-50%) scale(0.7); }
  20%  { opacity: 1; transform: translateX(-50%) scale(1.05); }
  70%  { opacity: 1; transform: translateX(-50%) scale(1); }
  100% { opacity: 0; transform: translateX(-50%) scale(0.88); }
}
.toast.widoczny { animation: animacja-toast 1.1s ease forwards; }
</style>
</head>
<body>

<!-- ==========================================
     EKRAN MENU GŁÓWNEGO
     ========================================== -->
<div class="ekran" id="ekranMenu">

  <div class="tytul">mat-hub</div>

  <div class="menu-srodek">

    <!-- wybór trybów gry -->
    <div class="lista-trybow" id="listaTrybow">
      <div class="tryb aktywny" data-tryb="dzialania">
        <div class="tryb-ikona">±</div>
        <div class="tryb-nazwa">Działania</div>
      </div>
      <div class="tryb aktywny" data-tryb="rozklad">
        <div class="tryb-ikona">x²</div>
        <div class="tryb-nazwa">Rozkład</div>
      </div>
      <div class="tryb aktywny" data-tryb="wzory">
        <div class="tryb-ikona">f(x)</div>
        <div class="tryb-nazwa">Wzory</div>
      </div>
      <div class="tryb aktywny" data-tryb="pitagoras">
        <div class="tryb-ikona">△</div>
        <div class="tryb-nazwa">Pitagoras</div>
      </div>
    </div>

    <!-- opcje działań (widoczne tylko gdy tryb "działania" aktywny) -->
    <div class="blok" id="opcje-dzialan">
      <div class="blok-etykieta">Działania</div>
      <div class="rzad" id="przyciskiDzialan">
        <div class="przycisk-dzialania aktywny" data-op="+">+</div>
        <div class="przycisk-dzialania aktywny" data-op="−">−</div>
        <div class="przycisk-dzialania aktywny" data-op="×">×</div>
        <div class="przycisk-dzialania aktywny" data-op="÷">÷</div>
      </div>
    </div>

    <!-- poziom trudności -->
    <div class="blok">
      <div class="blok-etykieta">Poziom</div>
      <div class="rzad" id="przyciskiPoziomu">
        <div class="pigulka aktywny" data-poziom="latwy">Łatwy</div>
        <div class="pigulka" data-poziom="sredni">Średni</div>
        <div class="pigulka" data-poziom="trudny">Trudny</div>
      </div>
    </div>

  </div>

  <div class="menu-dol">
    <button class="btn" id="btnGraj">Graj</button>
  </div>

</div>

<!-- ==========================================
     EKRAN WYNIKÓW
     ========================================== -->
<div class="ekran ukryty" id="ekranWyniki">
  <div class="koniec-srodek">
    <div class="tytul" style="font-size: clamp(22px,7vw,34px)">wyniki</div>
    <div class="siatka-wynikow">
      <div class="kafelek-wyniku"><div class="wartosc-wyniku" id="wynikPunkty">0</div><div class="etykieta-wyniku">Punkty</div></div>
      <div class="kafelek-wyniku"><div class="wartosc-wyniku" id="wynikTrafinosc">—</div><div class="etykieta-wyniku">Trafność</div></div>
      <div class="kafelek-wyniku"><div class="wartosc-wyniku" id="wynikPoprawne">0</div><div class="etykieta-wyniku">Poprawne</div></div>
      <div class="kafelek-wyniku"><div class="wartosc-wyniku" id="wynikKombo">0</div><div class="etykieta-wyniku">Max combo</div></div>
    </div>
    <div style="font-size:13px;color:var(--zolty);text-align:center" id="wynikKomunikat"></div>
    <button class="btn" id="btnJeszczeRaz">Jeszcze raz</button>
    <button class="btn duch" id="btnDoMenu">← Menu</button>
  </div>
</div>

<!-- toast na combo -->
<div class="toast" id="toast"></div>

<!-- ==========================================
     OBSZAR GRY
     ========================================== -->
<div class="wrap">

  <!-- nagłówek: punkty / combo / menu -->
  <div class="naglowek">
    <div class="punkty" id="licznikPunktow">0</div>
    <div class="combo" id="wyswietlaczKombo"></div>
    <button class="przycisk-menu" id="btnMenu">Menu</button>
  </div>

  <!-- pasek streak (5 kropek) -->
  <div class="rzad-streak">
    <div class="kropki-streak" id="kropkiStreak"></div>
    <div class="pasek-combo-wrap" id="paselKomboWrap" style="display:none">
      <div class="pasek-combo" id="pasekKombo"></div>
    </div>
  </div>

  <!-- karta z pytaniem -->
  <div class="karta" id="karta">
    <div class="etykieta-pytania" id="etykietaPytania"></div>

    <!-- widok: działania arytmetyczne -->
    <div id="widokDzialania">
      <div class="pytanie-arytm" id="pytanieArytm"></div>
    </div>

    <!-- widok: rozkład kwadratowy -->
    <div id="widokRozklad" style="display:none">
      <div class="pytanie-poly" id="pytanieWielomian"></div>
      <div class="podpowiedz-iloczynowa" id="podpowiedzIloczynowa"></div>
    </div>

    <!-- widok: wzory skróconego mnożenia -->
    <div id="widokWzory" style="display:none">
      <div class="pytanie-poly" id="pytanieWzor"></div>
      <div class="podpowiedz-iloczynowa" id="podpowiedzWzor"></div>
    </div>

    <!-- widok: twierdzenie Pitagorasa -->
    <div id="widokPitagoras" style="display:none">
      <div class="pytanie-poly" id="pytaniePitagoras"></div>
      <!-- SVG trójkąt rysowany dynamicznie -->
      <svg class="trojkat-svg" id="trojkatSVG" viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <!-- animacja pop (np. "+20") -->
    <div class="pop-animacja" id="popAnimacja"></div>
  </div>

  <!-- ── KLAWIATURA: działania (jedno pole) ── -->
  <div id="klawiaturaDzialania">
    <div class="klawiatura">
      <div class="klawisz" data-akcja="7">7</div>
      <div class="klawisz" data-akcja="8">8</div>

  <div id="klawiaturaPolaB" style="display:none">
    <div class="taby-pol" id="tabyB">
      <div class="tab-pola aktywny" data-pole="0">b</div>
      <div class="tab-pola" data-pole="1">b</div>
      <div class="tab-pola" data-pole="2">b</div>
    </div>
    <div class="rzad-pol">
      <div class="pole-odpowiedzi aktywny" id="poleB0">
        <div class="etykieta-pola" id="etB0">b</div>
        <div class="wartosc-pola placeholder" id="valB0">?</div>
      </div>
      <div class="separator-pol" id="sepB0">·</div>
      <div class="pole-odpowiedzi" id="poleB1">
        <div class="etykieta-pola" id="etB1">b</div>
        <div class="wartosc-pola placeholder" id="valB1">?</div>
      </div>
      <div class="separator-pol" id="sepB1">·</div>
      <div class="pole-odpowiedzi" id="poleB2">
        <div class="etykieta-pola" id="etB2">b</div>
        <div class="wartosc-pola placeholder" id="valB2">?</div>
      </div>
    </div>
    <div class="klawiatura">
      <div class="klawisz" data-c="7">7</div>
      <div class="klawisz" data-c="8">8</div>
      <div class="klawisz" data-c="9">9</div>
      <div class="klawisz znak" data-c="-">±</div>
      <div class="klawisz" data-c="4">4</div>
      <div class="klawisz" data-c="5">5</div>
      <div class="klawisz" data-c="6">6</div>
      <div class="klawisz kasowanie" data-c="del">⌫</div>
      <div class="klawisz" data-c="1">1</div>
      <div class="klawisz" data-c="2">2</div>
      <div class="klawisz" data-c="3">3</div>
      <div class="klawisz kasowanie" data-c="clr">C</div>
      <div class="klawisz szerokie" data-c="0">0</div>
      <div class="klawisz pominij" data-c="skip">skip</div>
      <div class="klawisz zatwierdz" data-c="ok">↵</div>

  </div>

</div><!-- koniec .wrap -->

<script>
// ===========================================
// KONFIGURACJA POZIOMÓW TRUDNOŚCI
// ===========================================
// Każdy poziom określa zakresy liczb dla poszczególnych trybów.

const POZIOMY = {
  latwy: {
    dzialanieMax: 12,      // max liczba w dodawaniu/odejmowaniu
    mnozeniMax:   10,      // max liczba w mnożeniu
    dzielenieMax: 10,      // max dzielnik/wynik w dzieleniu
    rozkladMax:   7,       // max pierwiastek w rozkładzie
    wspolczynniki: [1],    // tylko x² (bez 2x², 3x²)
    ujemneRzerwiastki: false,
    podwojnyPierwiastek: false,
    wzoryMax:     7,       // max b we wzorach
    pitagorasMax: 15,      // max wartość boku w Pitagorasie
  },
  sredni: {
    dzialanieMax: 20,
    mnozeniMax:   12,
    dzielenieMax: 12,
    rozkladMax:   10,
    wspolczynniki: [1, 2, 3],
    ujemneRzerwiastki: true,
    podwojnyPierwiastek: false,
    wzoryMax:     9,
    pitagorasMax: 25,
  },
  trudny: {
    dzialanieMax: 30,
    mnozeniMax:   15,
    dzielenieMax: 15,
    rozkladMax:   12,
    wspolczynniki: [1, 2, 3, 5],
    ujemneRzerwiastki: true,
    podwojnyPierwiastek: true,
    wzoryMax:     9,
    pitagorasMax: 40,
  },
};

// ===========================================
// STAN GRY
// ===========================================
// Tutaj trzymamy wszystko co się zmienia podczas grania.

const stan = {
  // wyniki sesji
  punkty:      0,
  streak:      0,   // ile z rzędu dobrze
  maxStreak:   0,   // rekord streaka
  poprawne:    0,
  bledne:      0,
  mnoznikKombo: 1,  // ×1, ×2, ×3... co 5 z rzędu

  // konfiguracja z menu
  poziom:      'latwy',
  aktywneOperatory: ['+', '−', '×', '÷'],
  aktywneTypy:      ['dzialania', 'rozklad', 'wzory', 'pitagoras'],

  // bieżące pytanie
  trybGry:   'dzialania', // który tryb aktualnie
  pytanie:   null,         // obiekt z danymi pytania
  gra:       false,        // czy gra trwa

  // bufory wpisanych odpowiedzi
  buforJeden:  '',         // dla trybu z jednym polem (działania)
  buforDwa:    ['', ''],   // dla trybu z dwoma polami (rozkład, pitagoras)
  aktywnePoleDwa: 0,
  buforTrzy:   ['', '', ''],  // dla trybu z trzema polami (wzory)
  aktywnePoleTrzy: 0,
};

// ===========================================
// SKRÓTY DO ELEMENTÓW DOM
// ===========================================

const el = id => document.getElementById(id);

// ekrany
const ekranMenu   = el('ekranMenu');
const ekranWyniki = el('ekranWyniki');

// obszar gry
const karta              = el('karta');
const etykietaPytania    = el('etykietaPytania');
const popAnimacja        = el('popAnimacja');
const licznikPunktow     = el('licznikPunktow');
const wyswietlaczKombo   = el('wyswietlaczKombo');
const kropkiStreak       = el('kropkiStreak');
const paselKomboWrap     = el('paselKomboWrap');
const pasekKombo         = el('pasekKombo');
const toastEl            = el('toast');

// widoki pytań
const widokDzialania     = el('widokDzialania');
const widokRozklad       = el('widokRozklad');
const widokWzory         = el('widokWzory');
const widokPitagoras     = el('widokPitagoras');

// klawiatury
const klawiaturaDzialania = el('klawiaturaDzialania');
const klawiaturaPolaA     = el('klawiaturaPolaA');
const klawiaturaPolaB     = el('klawiaturaPolaB');

// pola odpowiedzi (dwa pola)
const polaA = [el('poleA0'), el('poleA1')];
const valA  = [el('valA0'),  el('valA1')];
const etA   = [el('etA0'),   el('etA1')];

// pola odpowiedzi (trzy pola)
const polaB = [el('poleB0'), el('poleB1'), el('poleB2')];
const valB  = [el('valB0'),  el('valB1'),  el('valB2')];
const etB   = [el('etB0'),   el('etB1'),   el('etB2')];

// zbuduj 5 kropek streaka
for (let i = 0; i < 5; i++) {
  const k = document.createElement('div');
  k.className = 'kropka';
  kropkiStreak.appendChild(k);
}
const kropki = [...kropkiStreak.querySelectorAll('.kropka')];

// ===========================================
// POMOCNICZE FUNKCJE
// ===========================================

// losowa liczba całkowita między a i b (włącznie)
function losuj(a, b) {
  return Math.floor(Math.random() * (b - a + 1)) + a;
}

// losowy element z tablicy
function losujZ(tablica) {
  return tablica[Math.floor(Math.random() * tablica.length)];
}

// HTML dla przyciemnionego tekstu (znaki operatorów)
function szary(tekst) {
  return `<span style="color:var(--tekst2)">${tekst}</span>`;
}

// HTML dla jeszcze ciemniejszego tekstu (= 0 itp.)
function bDb(tekst) {
  return `<span style="color:var(--tekst3)">${tekst}</span>`;
}

// HTML dla zielonego tekstu (poprawna odpowiedź)
function zielony(tekst) {
  return `<span style="color:var(--zielony)">${tekst}</span>`;
}

// HTML dla podkreślonego blanka do uzupełnienia
function blank(wartosc, id) {
  return `<span class="blank"${id ? ` id="${id}"` : ''}>${wartosc || '?'}</span>`;
}

// ===========================================
// WYBÓR NASTĘPNEGO PYTANIA
// ===========================================

function nastepnePytanie() {
  // losuj tryb z aktywnych
  const dostepne = stan.aktywneTypy.length ? stan.aktywneTypy : ['dzialania'];
  stan.trybGry = losujZ(dostepne);

  // pokaż/ukryj odpowiednie widoki i klawiatury
  widokDzialania.style.display  = stan.trybGry === 'dzialania'  ? '' : 'none';
  widokRozklad.style.display    = stan.trybGry === 'rozklad'    ? '' : 'none';
  widokWzory.style.display      = stan.trybGry === 'wzory'      ? '' : 'none';
  widokPitagoras.style.display  = stan.trybGry === 'pitagoras'  ? '' : 'none';

  klawiaturaDzialania.style.display = stan.trybGry === 'dzialania'  ? '' : 'none';
  klawiaturaPolaA.style.display     = (stan.trybGry === 'rozklad' || stan.trybGry === 'pitagoras') ? '' : 'none';
  klawiaturaPolaB.style.display     = stan.trybGry === 'wzory'      ? '' : 'none';

  // wygeneruj pytanie odpowiedniego trybu
  if      (stan.trybGry === 'dzialania')  generujDzialanie();
  else if (stan.trybGry === 'rozklad')    generujRozklad();
  else if (stan.trybGry === 'wzory')      generujWzory();
  else if (stan.trybGry === 'pitagoras')  generujPitagoras();
}

// ===========================================
// TRYB 1: DZIAŁANIA ARYTMETYCZNE
// ===========================================
// Losujemy dwie liczby i operator, gracz wpisuje wynik.

function generujDzialanie() {
  const cfg = POZIOMY[stan.poziom];
  const ops = stan.aktywneOperatory.length ? stan.aktywneOperatory : ['+'];
  const operator = losujZ(ops);

  let a, b, odpowiedz;

  if (operator === '+') {
    a = losuj(1, cfg.dzialanieMax);
    b = losuj(1, cfg.dzialanieMax);
    odpowiedz = a + b;
  } else if (operator === '−') {
    a = losuj(1, cfg.dzialanieMax);
    b = losuj(1, cfg.dzialanieMax);
    if (b > a) [a, b] = [b, a]; // żeby wynik był nieujemny
    odpowiedz = a - b;
  } else if (operator === '×') {
    a = losuj(1, cfg.mnozeniMax);
    b = losuj(1, cfg.mnozeniMax);
    odpowiedz = a * b;
  } else {
    // dzielenie — zawsze całkowite, bo najpierw losujemy wynik
    b = losuj(2, cfg.dzielenieMax);
    odpowiedz = losuj(1, cfg.dzielenieMax);
    a = b * odpowiedz;
  }

  stan.pytanie = { odpowiedz };
  stan.buforJeden = '';

  const nazwyOperatorow = { '+': 'Dodawanie', '−': 'Odejmowanie', '×': 'Mnożenie', '÷': 'Dzielenie' };
  etykietaPytania.textContent = nazwyOperatorow[operator];

  // wyświetl pytanie z ? po znaku równości
  el('pytanieArytm').innerHTML =
    `${a}<span class="operator"> ${operator} </span>${b}` +
    `<span class="rowna-sie"> = </span>` +
    `<span class="placeholder odpowiedz" id="odp">?</span>`;
}

// aktualizuje ? w pytaniu arytmetycznym na bieżąco podczas wpisywania
function odswiezOdpowiedzArytm() {
  const odp = el('odp');
  if (!odp) return;
  odp.textContent = stan.buforJeden || '?';
  odp.className = 'odpowiedz' + (stan.buforJeden ? '' : ' placeholder');
}

// ===========================================
// TRYB 2: ROZKŁAD KWADRATOWY
// ===========================================
// Gracz widzi trójmian ax²+bx+c=0 i wpisuje miejsca zerowe.
// Wartości bezwzględne pierwiastków — znaki są już pokazane w nawiasach.

function generujRozklad() {
  const cfg = POZIOMY[stan.poziom];
  const wspolczynnik = losujZ(cfg.wspolczynniki);

  // losujemy pierwiastki (ze znakiem jeśli poziom to pozwala)
  const losujPierwiastek = () => {
    const wartosc = losuj(1, cfg.rozkladMax);
    const znak = cfg.ujemneRzerwiastki && Math.random() < 0.5 ? -1 : 1;
    return wartosc * znak;
  };

  let r1 = losujPierwiastek();
  let r2 = cfg.podwojnyPierwiastek && Math.random() < 0.2
    ? r1  // podwójny pierwiastek (x-r)²
    : losujPierwiastek();

  // współczynniki po rozwinięciu: w·x² + B·x + C = 0
  const B = -wspolczynnik * (r1 + r2);
  const C =  wspolczynnik * r1 * r2;

  stan.pytanie = { r1, r2, wspolczynnik };
  stan.buforDwa = ['', ''];
  stan.aktywnePoleDwa = 0;

  etykietaPytania.textContent = 'Miejsca zerowe';

  el('pytanieWielomian').innerHTML = zbudujWielomian(wspolczynnik, B, C);
  el('podpowiedzIloczynowa').innerHTML = zbudujPostacIloczynowa(r1, r2, wspolczynnik, false);

  odswiezTabyA(['x₁', 'x₂']);
  odswiezPolaA();
}

// buduje HTML wielomianu w·x² + B·x + C = 0
function zbudujWielomian(w, B, C) {
  let html = w === 1 ? `x<sup>2</sup>` : `${w}x<sup>2</sup>`;
  if (B !== 0) {
    html += ` ${szary(B > 0 ? '+' : '−')} ${Math.abs(B) === 1 ? 'x' : `${Math.abs(B)}x`}`;
  }
  if (C !== 0) {
    html += ` ${szary(C > 0 ? '+' : '−')} ${Math.abs(C)}`;
  }
  return html + ` ${bDb('= 0')}`;
}

// buduje HTML postaci iloczynowej (x ± |r1|)(x ± |r2|) = 0
// jeśli ujawnij=true, pokazuje zielone liczby zamiast blanków
function zbudujPostacIloczynowa(r1, r2, wspolczynnik, ujawnij) {
  const przedrostek = wspolczynnik === 1 ? '' : `${wspolczynnik}`;

  const nawias = (r, indeks) => {
    if (r === 0) return '(x)';
    const znak = r > 0 ? '−' : '+'; // jeśli r>0 to (x-r), jeśli r<0 to (x+|r|)
    const wartosc = Math.abs(r);
    if (ujawnij) {
      return `(x ${szary(znak)} ${zielony(wartosc)})`;
    }
    const wpisane = stan.buforDwa[indeks] || '?';
    return `(x ${szary(znak)} ${blank(wpisane, `b${indeks}`)})`;
  };

  // podwójny pierwiastek
  if (r1 === r2 && ujawnij) {
    return `${przedrostek}(x ${szary(r1 > 0 ? '−' : '+')} ${zielony(Math.abs(r1))})<sup>2</sup> ${bDb('= 0')}`;
  }

  return `${przedrostek}${nawias(r1, 0)}${nawias(r2, 1)} ${bDb('= 0')}`;
}

function odswiezPolaA() {
  stan.buforDwa.forEach((wartosc, i) => {
    valA[i].textContent = wartosc || '?';
    valA[i].className = 'wartosc-pola' + (wartosc ? '' : ' placeholder');
  });
  if (stan.trybGry === 'rozklad' && stan.pytanie) {
    const { r1, r2, wspolczynnik } = stan.pytanie;
    el('podpowiedzIloczynowa').innerHTML = zbudujPostacIloczynowa(r1, r2, wspolczynnik, false);
  }
  // aktualizuj ? w pytaniu Pitagorasa podczas wpisywania
  if (stan.trybGry === 'pitagoras') {
    const odpPit = el('odpPit');
    if (odpPit) {
      const v = stan.buforDwa[0];
      odpPit.textContent = v || '?';
      odpPit.className = 'odpowiedz' + (v ? '' : ' placeholder');
    }
  }
}

function odswiezTabyA(etykiety) {
  etykiety.forEach((et, i) => {
    etA[i].textContent = et;
    polaA[i].className = 'pole-odpowiedzi' + (i === stan.aktywnePoleDwa ? ' aktywny' : '');
  });
  const taby = el('tabyA').querySelectorAll('.tab-pola');
  taby.forEach((t, i) => {
    t.textContent = etykiety[i];
    t.classList.toggle('aktywny', i === stan.aktywnePoleDwa);
  });
}

// ===========================================
// TRYB 3: WZORY SKRÓCONEGO MNOŻENIA
// ===========================================
// Typ wzoru losowany jest spośród czterech:
//   0 → (ax+b)²  złóż lub rozpisz
//   1 → (ax−b)²
//   2 → (ax+b)(ax−b)
//   3 → (x+b)³ (tylko trudny)
//
// Kierunek: złóż = widzisz rozwinięcie, wpisujesz składniki
//           rozpisz = widzisz postać skróconą, wpisujesz rozwinięcie

function generujWzory() {
  const cfg  = POZIOMY[stan.poziom];
  const b    = losuj(2, Math.min(cfg.wzoryMax, 9));
  const typ  = losuj(0, stan.poziom === 'trudny' ? 3 : 2);
  const kier = losuj(0, 1); // 0=złóż, 1=rozpisz

  // czy a > 1 (tylko dla złożenia, na średnim/trudnym)
  const mozliwoscA = (kier === 0) && (typ <= 2) && (stan.poziom !== 'latwy');
  const a = mozliwoscA ? losujZ([1, 1, 2, 3]) : 1;

  const a2   = a * a;
  const b2   = b * b;
  const ab2  = 2 * a * b;
  const ax   = a === 1 ? 'x' : `${a}x`;

  // buduj HTML rozwinięcia i postaci skróconej
  let rozniecie, skrocona, etykieta, odpowiedzi;

  if (typ === 0) {
    // (ax+b)² = a²x² + 2abx + b²
    rozniecie = `${a2 === 1 ? 'x' : a2 + 'x'}<sup>2</sup> ${szary('+')} ${ab2}x ${szary('+')} ${b2}`;
    skrocona  = `(${ax} ${szary('+')} ${b})<sup>2</sup>`;
    etykieta  = '(ax+b)²';
    odpowiedzi = kier === 0 ? (a === 1 ? [b] : [a, b]) : [a2, ab2, b2];
  } else if (typ === 1) {
    // (ax−b)² = a²x² − 2abx + b²
    rozniecie = `${a2 === 1 ? 'x' : a2 + 'x'}<sup>2</sup> ${szary('−')} ${ab2}x ${szary('+')} ${b2}`;
    skrocona  = `(${ax} ${szary('−')} ${b})<sup>2</sup>`;
    etykieta  = '(ax−b)²';
    odpowiedzi = kier === 0 ? (a === 1 ? [b] : [a, b]) : [a2, ab2, b2];
  } else if (typ === 2) {
    // (ax+b)(ax−b) = a²x² − b²
    rozniecie = `${a2 === 1 ? 'x' : a2 + 'x'}<sup>2</sup> ${szary('−')} ${b2}`;
    skrocona  = `(${ax} ${szary('+')} ${b})(${ax} ${szary('−')} ${b})`;
    etykieta  = '(ax+b)(ax−b)';
    odpowiedzi = kier === 0 ? (a === 1 ? [b] : [a, b]) : [a2, b2];
  } else {
    // (x+b)³ = x³ + 3bx² + 3b²x + b³
    const _3b = 3*b, _3b2 = 3*b2, b3 = b2*b;
    rozniecie = `x<sup>3</sup> ${szary('+')} ${_3b}x<sup>2</sup> ${szary('+')} ${_3b2}x ${szary('+')} ${b3}`;
    skrocona  = `(x ${szary('+')} ${b})<sup>3</sup>`;
    etykieta  = '(x+b)³';
    odpowiedzi = kier === 0 ? [b] : [_3b, _3b2, b3];
  }

  // etykiety pól do uzupełnienia
  const etPol = kier === 0
    ? (odpowiedzi.length === 1 ? ['b'] : ['a', 'b'])
    : (odpowiedzi.length === 2 ? ['a²', 'b²'] : (typ === 3 ? ['3b', '3b²', 'b³'] : ['a²', '2ab', 'b²']));

  stan.pytanie = { a, b, typ, kier, odpowiedzi, etPol };
  stan.buforTrzy = odpowiedzi.map(() => '');
  stan.aktywnePoleTrzy = 0;

  etykietaPytania.textContent = kier === 0 ? `złóż → ${etykieta}` : `rozpisz ${etykieta}`;

  // co pokazujemy w karcie: przy złożeniu → rozwinięcie, przy rozpisaniu → postać skrócona
  el('pytanieWzor').innerHTML = (kier === 0 ? rozniecie : skrocona) + ` ${bDb('= ?')}`;

  // skonfiguruj pola
  const n = odpowiedzi.length;
  polaB.forEach((p, i) => { p.style.display = i < n ? '' : 'none'; });
  el('sepB0').style.display = n >= 2 ? '' : 'none';
  el('sepB1').style.display = n >= 3 ? '' : 'none';

  const tabyB = el('tabyB').querySelectorAll('.tab-pola');
  tabyB.forEach((t, i) => { t.style.display = i < n ? '' : 'none'; t.textContent = etPol[i] || ''; });

  etPol.forEach((et, i) => { if (i < n) etB[i].textContent = et; });

  odswiezPolaB();
}

function odswiezPolaB() {
  const { odpowiedzi, etPol, a, b, typ, kier } = stan.pytanie;
  const n = odpowiedzi.length;

  valB.forEach((v, i) => {
    if (i >= n) return;
    const wartosc = stan.buforTrzy[i];
    v.textContent = wartosc || '?';
    v.className = 'wartosc-pola' + (wartosc ? '' : ' placeholder');
  });

  // odśwież blanki w podpowiedzi wzoru
  const bv = i => stan.buforTrzy[i] || '?';
  const ax = a === 1 ? 'x' : `${a}x`;

  if (kier === 0) {
    // złóż: blanki to a i b w postaci skróconej
    const bVal = n === 1 ? blank(bv(0), 'wz0') : blank(bv(1), 'wz1');
    const xPart = n >= 2 ? `${blank(bv(0), 'wz0')}x` : 'x';
    if      (typ === 0) el('podpowiedzWzor').innerHTML = `(${xPart} ${szary('+')} ${bVal})<sup>2</sup>`;
    else if (typ === 1) el('podpowiedzWzor').innerHTML = `(${xPart} ${szary('−')} ${bVal})<sup>2</sup>`;
    else if (typ === 2) el('podpowiedzWzor').innerHTML = `(${xPart} ${szary('+')} ${bVal})(${xPart} ${szary('−')} ${bVal})`;
    else                el('podpowiedzWzor').innerHTML = `(x ${szary('+')} ${blank(bv(0), 'wz0')})<sup>3</sup>`;
  } else {
    // rozpisz: blanki to współczynniki rozwinięcia
    if (typ === 0 || typ === 1) {
      const sg = typ === 0 ? '+' : '−';
      el('podpowiedzWzor').innerHTML = `${blank(bv(0),'wz0')}x<sup>2</sup> ${szary(sg)} ${blank(bv(1),'wz1')}x ${szary('+')} ${blank(bv(2),'wz2')}`;
    } else if (typ === 2) {
      el('podpowiedzWzor').innerHTML = `${blank(bv(0),'wz0')}x<sup>2</sup> ${szary('−')} ${blank(bv(1),'wz1')}`;
    } else {
      el('podpowiedzWzor').innerHTML = `x<sup>3</sup> ${szary('+')} ${blank(bv(0),'wz0')}x<sup>2</sup> ${szary('+')} ${blank(bv(1),'wz1')}x ${szary('+')} ${blank(bv(2),'wz2')}`;
    }
  }

  // podświetl aktywne pole i tab
  polaB.forEach((p, i) => {
    p.className = 'pole-odpowiedzi' + (i === stan.aktywnePoleTrzy ? ' aktywny' : '');
  });
  el('tabyB').querySelectorAll('.tab-pola').forEach((t, i) => {
    t.classList.toggle('aktywny', i === stan.aktywnePoleTrzy);
  });
}

// ===========================================
// TRYB 4: TWIERDZENIE PITAGORASA
// ===========================================
// Trójkąt prostokątny: a² + b² = c²
// Losujemy jedną z konfiguracji:
//   - znamy a i b, liczymy c
//   - znamy a i c, liczymy b (b = przyprostokątna)
//   - znamy b i c, liczymy a (a = przyprostokątna)
//
// Używamy trójek pitagorejskich żeby wyniki były całkowite.

// lista trójek pitagorejskich (a, b, c) gdzie a²+b²=c²
const TROJKI_PITAGOREJSKIE = [
  [3,4,5], [5,12,13], [6,8,10], [8,15,17], [7,24,25],
  [9,12,15], [10,24,26], [12,16,20], [15,20,25], [20,21,29],
  [9,40,41], [12,35,37], [11,60,61], [13,84,85], [6,8,10],
];

function generujPitagoras() {
  const cfg = POZIOMY[stan.poziom];

  // filtruj trójki pasujące do poziomu
  const pasujace = TROJKI_PITAGOREJSKIE.filter(([a, b, c]) => c <= cfg.pitagorasMax);
  const trojka = losujZ(pasujace.length ? pasujace : TROJKI_PITAGOREJSKIE);
  const [a, b, c] = trojka;

  // losuj co szukamy: 0=szukamy c, 1=szukamy b, 2=szukamy a
  const szukamy = losuj(0, 2);

  let dane, szukanaWartosc, etykietyPol;

  if (szukamy === 0) {
    // znamy a i b, szukamy c (przeciwprostokątna)
    dane = { a, b, c, szukamy: 'c' };
    szukanaWartosc = c;
    etykietyPol = ['c'];
  } else if (szukamy === 1) {
    // znamy a i c, szukamy b
    dane = { a, b, c, szukamy: 'b' };
    szukanaWartosc = b;
    etykietyPol = ['b'];
  } else {
    // znamy b i c, szukamy a
    dane = { a, b, c, szukamy: 'a' };
    szukanaWartosc = a;
    etykietyPol = ['a'];
  }

  stan.pytanie = { ...dane, szukanaWartosc };
  stan.buforDwa = ['', ''];
  stan.aktywnePoleDwa = 0;

  etykietaPytania.textContent = 'Twierdzenie Pitagorasa';

  // pokaż pytanie tekstowe — ? z id żeby można aktualizować na bieżąco
  const szukanyBok = dane.szukamy;
  if (szukamy === 0) {
    el('pytaniePitagoras').innerHTML = `a=${a}, b=${b} ${bDb('→')} ${szukanyBok} = <span class="placeholder odpowiedz" id="odpPit">?</span>`;
  } else if (szukamy === 1) {
    el('pytaniePitagoras').innerHTML = `a=${a}, c=${c} ${bDb('→')} ${szukanyBok} = <span class="placeholder odpowiedz" id="odpPit">?</span>`;
  } else {
    el('pytaniePitagoras').innerHTML = `b=${b}, c=${c} ${bDb('→')} ${szukanyBok} = <span class="placeholder odpowiedz" id="odpPit">?</span>`;
  }

  // narysuj trójkąt SVG z oznaczeniami
  narysujTrojkat(dane, szukamy);

  // dla Pitagorasa używamy klawiatury z jednym polem (klawiaturaPolaA z jedną kolumną)
  // ale pytanie ma tylko jedną odpowiedź, więc ukrywamy drugie pole
  polaA[0].style.display = '';
  polaA[1].style.display = 'none';
  el('tabyA').querySelectorAll('.tab-pola').forEach((t, i) => {
    t.style.display = i === 0 ? '' : 'none';
  });
  el('tabyA').querySelector('[data-pole="0"]').textContent = etykietyPol[0];
  etA[0].textContent = etykietyPol[0];

  // separator też chowamy
  const sep = document.querySelector('#klawiaturaPolaA .separator-pol');
  if (sep) sep.style.display = 'none';

  stan.buforDwa = ['', ''];
  stan.aktywnePoleDwa = 0;
  odswiezPolaA();
}

// rysuje trójkąt prostokątny SVG z oznaczeniami boków
function narysujTrojkat({ a, b, c, szukamy: co }, szukamyIndeks) {
  const svg = el('trojkatSVG');
  // trójkąt prostokątny: kąt prosty w lewym dolnym rogu
  // wierzchołki: lewy dół (20,120), prawy dół (170,120), lewy góra (20,20)
  const x1=20, y1=120; // kąt prosty
  const x2=170, y2=120; // prawy dół
  const x3=20, y3=20;  // lewy góra

  const kolor = (bok) => bok === co ? 'var(--akcent)' : 'var(--tekst2)';
  const wartosc = (bok, val) => bok === co ? '?' : val;

  svg.innerHTML = `
    <!-- linie trójkąta -->
    <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${kolor('a')}" stroke-width="2"/>
    <line x1="${x1}" y1="${y1}" x2="${x3}" y2="${y3}" stroke="${kolor('b')}" stroke-width="2"/>
    <line x1="${x2}" y1="${y2}" x2="${x3}" y2="${y3}" stroke="${kolor('c')}" stroke-width="2"/>
    <!-- znacznik kąta prostego -->
    <polyline points="${x1+12},${y1} ${x1+12},${y1-12} ${x1},${y1-12}"
      fill="none" stroke="var(--tekst3)" stroke-width="1.5"/>
    <!-- etykiety boków -->
    <text x="${(x1+x2)/2}" y="${y1+18}" text-anchor="middle"
      font-family="DM Mono,monospace" font-size="13" fill="${kolor('a')}">a=${wartosc('a',a)}</text>
    <text x="${x3+26}" y="${(y1+y3)/2+5}" text-anchor="start"
      font-family="DM Mono,monospace" font-size="13" fill="${kolor('b')}">b=${wartosc('b',b)}</text>
    <text x="${(x2+x3)/2+14}" y="${(y2+y3)/2-6}" text-anchor="start"
      font-family="DM Mono,monospace" font-size="13" fill="${kolor('c')}">c=${wartosc('c',c)}</text>
  `;
}

// ===========================================
// SPRAWDZANIE ODPOWIEDZI
// ===========================================

function sprawdzDzialanie() {
  const wpisane = parseInt(stan.buforJeden);
  if (isNaN(wpisane) || stan.buforJeden === '' || stan.buforJeden === '-') return;

  if (wpisane === stan.pytanie.odpowiedz) {
    trafiony();
  } else {
    bledny();
    // pokaż poprawną odpowiedź w miejscu ?
    const odp = el('odp');
    if (odp) { odp.textContent = stan.pytanie.odpowiedz; odp.className = 'odpowiedz'; }
  }

  const byloDobrze = (wpisane === stan.pytanie.odpowiedz);
  stan.buforJeden = '';
  if (byloDobrze) odswiezOdpowiedzArytm();
  setTimeout(() => { if (stan.gra) nastepnePytanie(); }, byloDobrze ? 160 : 950);
}

function sprawdzRozklad() {
  const v0 = parseInt(stan.buforDwa[0]);
  const v1 = parseInt(stan.buforDwa[1]);
  if (isNaN(v0) || isNaN(v1)) return;

  const { r1, r2, wspolczynnik } = stan.pytanie;
  // gracz wpisuje wartości bezwzględne — znaki są już w nawiasach
  const abs1 = Math.abs(r1), abs2 = Math.abs(r2);
  const ok = (v0 === abs1 && v1 === abs2) || (v0 === abs2 && v1 === abs1);

  if (ok) {
    trafiony();
  } else {
    bledny();
    el('podpowiedzIloczynowa').innerHTML = zbudujPostacIloczynowa(r1, r2, wspolczynnik, true);
  }
  setTimeout(() => { if (stan.gra) nastepnePytanie(); }, ok ? 160 : 1200);
}

function sprawdzWzory() {
  const { odpowiedzi } = stan.pytanie;
  const wpisane = odpowiedzi.map((_, i) => parseInt(stan.buforTrzy[i]));
  if (wpisane.some(isNaN)) return;

  const ok = odpowiedzi.every((oczekiwane, i) => wpisane[i] === oczekiwane);

  if (ok) {
    trafiony();
  } else {
    bledny();
    ujawnijWzory();
  }
  setTimeout(() => { if (stan.gra) nastepnePytanie(); }, ok ? 160 : 1400);
}

// pokazuje poprawną odpowiedź dla wzorów na zielono
function ujawnijWzory() {
  const { a, b, typ, kier, odpowiedzi } = stan.pytanie;
  const ax = a === 1 ? 'x' : `${zielony(a)}x`;

  if (kier === 0) {
    if      (typ === 0) el('podpowiedzWzor').innerHTML = `(${ax} ${szary('+')} ${zielony(b)})<sup>2</sup>`;
    else if (typ === 1) el('podpowiedzWzor').innerHTML = `(${ax} ${szary('−')} ${zielony(b)})<sup>2</sup>`;
    else if (typ === 2) el('podpowiedzWzor').innerHTML = `(${ax} ${szary('+')} ${zielony(b)})(${ax} ${szary('−')} ${zielony(b)})`;
    else                el('podpowiedzWzor').innerHTML = `(x ${szary('+')} ${zielony(b)})<sup>3</sup>`;
  } else {
    const [w0, w1, w2] = odpowiedzi;
    if (typ === 0 || typ === 1) {
      const sg = typ === 0 ? '+' : '−';
      el('podpowiedzWzor').innerHTML = `${zielony(w0)}x<sup>2</sup> ${szary(sg)} ${zielony(w1)}x ${szary('+')} ${zielony(w2)}`;
    } else if (typ === 2) {
      el('podpowiedzWzor').innerHTML = `${zielony(w0)}x<sup>2</sup> ${szary('−')} ${zielony(w1)}`;
    } else {
      el('podpowiedzWzor').innerHTML = `x<sup>3</sup> ${szary('+')} ${zielony(w0)}x<sup>2</sup> ${szary('+')} ${zielony(w1)}x ${szary('+')} ${zielony(w2)}`;
    }
  }
}

function sprawdzPitagoras() {
  const v = parseInt(stan.buforDwa[0]);
  if (isNaN(v)) return;

  const ok = v === stan.pytanie.szukanaWartosc;
  if (ok) {
    trafiony();
  } else {
    bledny();
    const odpPit = el('odpPit');
    if (odpPit) { odpPit.textContent = stan.pytanie.szukanaWartosc; odpPit.className = 'odpowiedz'; }
    const { a, b, c } = stan.pytanie;
    narysujTrojkatOdpowiedz({ a, b, c });
  }
  setTimeout(() => { if (stan.gra) nastepnePytanie(); }, ok ? 160 : 1100);
}

// rysuje trójkąt z wszystkimi wartościami na zielono dla szukanego boku
function narysujTrojkatOdpowiedz({ a, b, c }) {
  const svg = el('trojkatSVG');
  const x1=20, y1=120, x2=170, y2=120, x3=20, y3=20;
  svg.innerHTML = `
    <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--tekst2)" stroke-width="2"/>
    <line x1="${x1}" y1="${y1}" x2="${x3}" y2="${y3}" stroke="var(--tekst2)" stroke-width="2"/>
    <line x1="${x2}" y1="${y2}" x2="${x3}" y2="${y3}" stroke="var(--tekst2)" stroke-width="2"/>
    <polyline points="${x1+12},${y1} ${x1+12},${y1-12} ${x1},${y1-12}"
      fill="none" stroke="var(--tekst3)" stroke-width="1.5"/>
    <text x="${(x1+x2)/2}" y="${y1+16}" text-anchor="middle"
      font-family="DM Mono,monospace" font-size="13" fill="var(--zielony)">a=${a}</text>
    <text x="${x1-18}" y="${(y1+y3)/2}" text-anchor="middle"
      font-family="DM Mono,monospace" font-size="13" fill="var(--zielony)">b=${b}</text>
    <text x="${(x2+x3)/2+10}" y="${(y2+y3)/2-5}" text-anchor="middle"
      font-family="DM Mono,monospace" font-size="13" fill="var(--zielony)">c=${c}</text>
  `;
}

// ===========================================
// POMIŃ PYTANIE
// ===========================================

function pominPytanie() {
  if (!stan.gra) return;
  bledny();

  // ujawnij odpowiedź
  if (stan.trybGry === 'dzialania') {
    const odp = el('odp');
    if (odp) { odp.textContent = stan.pytanie.odpowiedz; odp.className = 'odpowiedz'; }
  } else if (stan.trybGry === 'rozklad') {
    const { r1, r2, wspolczynnik } = stan.pytanie;
    el('podpowiedzIloczynowa').innerHTML = zbudujPostacIloczynowa(r1, r2, wspolczynnik, true);
  } else if (stan.trybGry === 'wzory') {
    ujawnijWzory();
  } else if (stan.trybGry === 'pitagoras') {
    const { a, b, c } = stan.pytanie;
    narysujTrojkatOdpowiedz({ a, b, c });
  }

  setTimeout(() => { if (stan.gra) nastepnePytanie(); }, 1100);
}

// ===========================================
// TRAFIONY / BŁĘDNY
// ===========================================

function trafiony() {
  stan.streak++;
  stan.poprawne++;
  if (stan.streak > stan.maxStreak) stan.maxStreak = stan.streak;

  // co 5 z rzędu rośnie mnożnik
  stan.mnoznikKombo = Math.floor(stan.streak / 5) + 1;

  // działania dają 10 pkt, reszta 20 pkt (trudniejsze)
  const bazowePunkty = stan.trybGry === 'dzialania' ? 10 : 20;
  const zdobyte = bazowePunkty * stan.mnoznikKombo;

  stan.punkty += zdobyte;
  licznikPunktow.textContent = stan.punkty;

  animacjaPop(`+${zdobyte}`, 'var(--zielony)');
  migniecie('trafiony');
  odswiezStreak();

  if (navigator.vibrate) navigator.vibrate(22);
  if (stan.streak > 0 && stan.streak % 5 === 0) pokazToast(`×${stan.mnoznikKombo} combo`);
  if (stan.mnoznikKombo >= 2) startujTimerKombo();
}

function bledny() {
  stan.bledne++;
  stan.streak = 0;
  stan.mnoznikKombo = 1;

  animacjaPop('✕', 'var(--czerwony)');
  migniecie('bledny');
  odswiezStreak();
  zatrzymajTimerKombo();

  if (navigator.vibrate) navigator.vibrate([40, 15, 40]);
}

// ===========================================
// WIZUALNE EFEKTY
// ===========================================

function animacjaPop(tekst, kolor) {
  popAnimacja.textContent = tekst;
  popAnimacja.style.color = kolor;
  popAnimacja.style.transition = 'none';
  popAnimacja.style.opacity = '1';
  popAnimacja.style.transform = 'translate(-50%, -50%) scale(1)';

  requestAnimationFrame(() => {
    popAnimacja.style.transition = 'opacity 0.48s, transform 0.48s';
    popAnimacja.style.opacity = '0';
    popAnimacja.style.transform = 'translate(-50%, -70%) scale(1.3)';
  });
}

function migniecie(klasa) {
  karta.classList.remove('trafiony', 'bledny');
  void karta.offsetWidth; // wymusz reflow żeby animacja się zresetowała
  karta.classList.add(klasa);
  setTimeout(() => karta.classList.remove(klasa), 300);
}

function odswiezStreak() {
  const pozycja = stan.streak % 5;
  const ile = stan.streak > 0 && pozycja === 0 ? 5 : pozycja;
  kropki.forEach((k, i) => k.classList.toggle('aktywna', i < ile));

  if (stan.mnoznikKombo >= 2) {
    wyswietlaczKombo.textContent = `×${stan.mnoznikKombo}`;
    wyswietlaczKombo.classList.add('widoczny');
  } else {
    wyswietlaczKombo.classList.remove('widoczny');
  }
}

function pokazToast(komunikat) {
  toastEl.textContent = komunikat;
  toastEl.classList.remove('widoczny');
  void toastEl.offsetWidth;
  toastEl.classList.add('widoczny');
}

// ===========================================
// TIMER COMBO (pasek który się wypełnia)
// ===========================================
// Gdy masz combo ×2 lub więcej, masz 8 sekund na kolejne trafienie.
// Po wygaśnięciu streak spada do zera.

const CZAS_KOMBO = 8; // sekund
let timerKombo = null;
let pozostalyCzasKombo = 0;

function startujTimerKombo() {
  zatrzymajTimerKombo();
  pozostalyCzasKombo = CZAS_KOMBO;
  paselKomboWrap.style.display = '';
  pasekKombo.classList.remove('niski');
  pasekKombo.style.transition = 'none';
  pasekKombo.style.width = '100%';

  timerKombo = setInterval(() => {
    pozostalyCzasKombo -= 0.1;
    const procent = Math.max(0, pozostalyCzasKombo / CZAS_KOMBO * 100);
    pasekKombo.style.transition = 'width 0.1s linear';
    pasekKombo.style.width = procent + '%';
    if (pozostalyCzasKombo <= 2) pasekKombo.classList.add('niski');
    if (pozostalyCzasKombo <= 0) {
      zatrzymajTimerKombo();
      // combo wygasło
      if (stan.streak >= 5) {
        stan.streak = 0;
        stan.mnoznikKombo = 1;
        odswiezStreak();
      }
    }
  }, 100);
}

function zatrzymajTimerKombo() {
  clearInterval(timerKombo);
  paselKomboWrap.style.display = 'none';
}

// ===========================================
// OBSŁUGA KLAWIATURY NUMERYCZNEJ
// ===========================================
// Każda z trzech klawiatur obsługuje wpisywanie cyfr,
// kasowanie, zmianę znaku i zatwierdzenie.

// --- klawiatura dla jednego pola (działania) ---
el('klawiaturaDzialania').addEventListener('pointerdown', e => {
  const klawisz = e.target.closest('[data-akcja]');
  if (!klawisz || !stan.gra) return;
  e.preventDefault();
  const akcja = klawisz.dataset.akcja;

  if      (akcja === 'ok')   sprawdzDzialanie();
  else if (akcja === 'skip') pominPytanie();
  else if (akcja === 'clr')  { stan.buforJeden = ''; odswiezOdpowiedzArytm(); }
  else if (akcja === 'del')  { stan.buforJeden = stan.buforJeden.slice(0,-1); odswiezOdpowiedzArytm(); }
  else if (akcja === '-')    { stan.buforJeden = zmienZnak(stan.buforJeden); odswiezOdpowiedzArytm(); }
  else if (stan.buforJeden.replace('-','').length < 4) { stan.buforJeden += akcja; odswiezOdpowiedzArytm(); }
});

// --- klawiatura dla dwóch pól (rozkład, pitagoras) ---
el('klawiaturaPolaA').addEventListener('pointerdown', e => {
  const klawisz = e.target.closest('[data-b]');
  if (!klawisz || !stan.gra) return;
  e.preventDefault();
  const akcja = klawisz.dataset.b;
  const f = stan.aktywnePoleDwa;

  if (akcja === 'ok') {
    if (stan.trybGry === 'rozklad')    sprawdzRozklad();
    else if (stan.trybGry === 'pitagoras') sprawdzPitagoras();
    return;
  }
  if (akcja === 'skip') { pominPytanie(); return; }
  if (akcja === 'clr')  { stan.buforDwa[f] = ''; odswiezPolaA(); return; }
  if (akcja === 'del')  { stan.buforDwa[f] = stan.buforDwa[f].slice(0,-1); odswiezPolaA(); return; }
  if (akcja === '-' && stan.trybGry === 'rozklad') {
    stan.buforDwa[f] = zmienZnak(stan.buforDwa[f]);
    odswiezPolaA();
    return;
  }
  // cyfry — max 3 cyfry
  if (stan.buforDwa[f].replace('-','').length < 3) {
    stan.buforDwa[f] += akcja;
    odswiezPolaA();
  }
});

// --- klawiatura dla trzech pól (wzory) ---
el('klawiaturaPolaB').addEventListener('pointerdown', e => {
  const klawisz = e.target.closest('[data-c]');
  if (!klawisz || !stan.gra) return;
  e.preventDefault();
  const akcja = klawisz.dataset.c;
  const f = stan.aktywnePoleTrzy;

  if (akcja === 'ok')   { sprawdzWzory(); return; }
  if (akcja === 'skip') { pominPytanie(); return; }
  if (akcja === 'clr')  { stan.buforTrzy[f] = ''; odswiezPolaB(); return; }
  if (akcja === 'del')  { stan.buforTrzy[f] = stan.buforTrzy[f].slice(0,-1); odswiezPolaB(); return; }
  if (akcja === '-') return; // wzory — wartości zawsze dodatnie
  if (stan.buforTrzy[f].length < 4) { stan.buforTrzy[f] += akcja; odswiezPolaB(); }
});

// zmiana znaku liczby (np. 3 → -3 → 3)
function zmienZnak(bufor) {
  if (!bufor)          return '-';
  if (bufor === '-')   return '';
  if (bufor[0] === '-') return bufor.slice(1);
  return '-' + bufor;
}

// --- fokus na polach A (rozkład/pitagoras) ---
polaA.forEach((pole, i) => {
  pole.addEventListener('pointerdown', e => {
    if (!stan.gra) return;
    e.preventDefault();
    stan.aktywnePoleDwa = i;
    odswiezPolaA();
    // odśwież taby
    if (stan.trybGry === 'rozklad') odswiezTabyA(['x₁', 'x₂']);
  });
});
el('tabyA').querySelectorAll('.tab-pola').forEach((tab, i) => {
  tab.addEventListener('pointerdown', e => {
    if (!stan.gra) return;
    e.preventDefault();
    stan.aktywnePoleDwa = i;
    if (stan.trybGry === 'rozklad') odswiezTabyA(['x₁', 'x₂']);
    odswiezPolaA();
  });
});

// --- fokus na polach B (wzory) ---
polaB.forEach((pole, i) => {
  pole.addEventListener('pointerdown', e => {
    if (!stan.gra || !stan.pytanie || i >= stan.pytanie.odpowiedzi.length) return;
    e.preventDefault();
    stan.aktywnePoleTrzy = i;
    odswiezPolaB();
  });
});
el('tabyB').querySelectorAll('.tab-pola').forEach((tab, i) => {
  tab.addEventListener('pointerdown', e => {
    if (!stan.gra || !stan.pytanie) return;
    e.preventDefault();
    stan.aktywnePoleTrzy = i % stan.pytanie.odpowiedzi.length;
    odswiezPolaB();
  });
});

// ===========================================
// FIZYCZNA KLAWIATURA (desktop)
// ===========================================

document.addEventListener('keydown', e => {
  if (!stan.gra) return;

  // cyfry
  if (e.key >= '0' && e.key <= '9') {
    wcisnietoCyfre(e.key);
  } else if (e.key === '-') {
    wcisnietoMinus();
  } else if (e.key === 'Backspace') {
    e.preventDefault();
    wcisnietoKasuj();
  } else if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    wcisnietoZatwierdz();
  } else if (e.key === 'Escape') {
    wcisniętoCzysc();
  } else if (e.key === 'Tab') {
    e.preventDefault();
    wcisnietoTab();
  }
});

function wcisnietoCyfre(cyfra) {
  if (stan.trybGry === 'dzialania') {
    if (stan.buforJeden.replace('-','').length < 4) { stan.buforJeden += cyfra; odswiezOdpowiedzArytm(); }
  } else if (stan.trybGry === 'rozklad' || stan.trybGry === 'pitagoras') {
    const f = stan.aktywnePoleDwa;
    if (stan.buforDwa[f].replace('-','').length < 3) { stan.buforDwa[f] += cyfra; odswiezPolaA(); }
  } else if (stan.trybGry === 'wzory') {
    const f = stan.aktywnePoleTrzy;
    if (stan.buforTrzy[f].length < 4) { stan.buforTrzy[f] += cyfra; odswiezPolaB(); }
  }
}

function wcisnietoMinus() {
  if (stan.trybGry === 'dzialania') { stan.buforJeden = zmienZnak(stan.buforJeden); odswiezOdpowiedzArytm(); }
  else if (stan.trybGry === 'rozklad') { stan.buforDwa[stan.aktywnePoleDwa] = zmienZnak(stan.buforDwa[stan.aktywnePoleDwa]); odswiezPolaA(); }
}

function wcisnietoKasuj() {
  if (stan.trybGry === 'dzialania') { stan.buforJeden = stan.buforJeden.slice(0,-1); odswiezOdpowiedzArytm(); }
  else if (stan.trybGry === 'rozklad' || stan.trybGry === 'pitagoras') { const f=stan.aktywnePoleDwa; stan.buforDwa[f]=stan.buforDwa[f].slice(0,-1); odswiezPolaA(); }
  else if (stan.trybGry === 'wzory') { const f=stan.aktywnePoleTrzy; stan.buforTrzy[f]=stan.buforTrzy[f].slice(0,-1); odswiezPolaB(); }
}

function wcisnietoZatwierdz() {
  if      (stan.trybGry === 'dzialania')  sprawdzDzialanie();
  else if (stan.trybGry === 'rozklad')    sprawdzRozklad();
  else if (stan.trybGry === 'wzory')      sprawdzWzory();
  else if (stan.trybGry === 'pitagoras')  sprawdzPitagoras();
}

function wcisniętoCzysc() {
  if (stan.trybGry === 'dzialania') { stan.buforJeden = ''; odswiezOdpowiedzArytm(); }
  else if (stan.trybGry === 'rozklad' || stan.trybGry === 'pitagoras') { stan.buforDwa[stan.aktywnePoleDwa]=''; odswiezPolaA(); }
  else if (stan.trybGry === 'wzory') { stan.buforTrzy[stan.aktywnePoleTrzy]=''; odswiezPolaB(); }
}

function wcisnietoTab() {
  if (stan.trybGry === 'rozklad') { stan.aktywnePoleDwa=(stan.aktywnePoleDwa+1)%2; odswiezTabyA(['x₁','x₂']); odswiezPolaA(); }
  else if (stan.trybGry === 'wzory' && stan.pytanie) { stan.aktywnePoleTrzy=(stan.aktywnePoleTrzy+1)%stan.pytanie.odpowiedzi.length; odswiezPolaB(); }
}

// ===========================================
// FLOW GRY (start, wyniki, menu)
// ===========================================

function rozpocznijGre() {
  // reset statystyk
  stan.punkty = 0;
  stan.streak = 0;
  stan.maxStreak = 0;
  stan.poprawne = 0;
  stan.bledne = 0;
  stan.mnoznikKombo = 1;
  stan.gra = true;

  licznikPunktow.textContent = '0';
  kropki.forEach(k => k.classList.remove('aktywna'));
  wyswietlaczKombo.classList.remove('widoczny');
  zatrzymajTimerKombo();

  ekranMenu.classList.add('ukryty');
  ekranWyniki.classList.add('ukryty');

  nastepnePytanie();
}

function pokazWyniki() {
  stan.gra = false;
  zatrzymajTimerKombo();

  el('wynikPunkty').textContent   = stan.punkty;
  el('wynikPoprawne').textContent  = stan.poprawne;
  el('wynikKombo').textContent     = stan.maxStreak;

  const wszystkie = stan.poprawne + stan.bledne;
  el('wynikTrafinosc').textContent = wszystkie
    ? Math.round(stan.poprawne / wszystkie * 100) + '%'
    : '—';

  const komunikaty = [
    [0,   'Ćwicz dalej!'],
    [80,  'Nieźle!'],
    [200, 'Świetnie!'],
    [450, 'Rewelacja!'],
    [800, 'Legenda!'],
  ];
  let komunikat = '';
  for (const [prog, tekst] of komunikaty) {
    if (stan.punkty >= prog) komunikat = tekst;
  }
  el('wynikKomunikat').textContent = komunikat;

  ekranWyniki.classList.remove('ukryty');
  if (navigator.vibrate) navigator.vibrate([50, 30, 50, 30, 80]);
}

function wrocDoMenu() {
  stan.gra = false;
  zatrzymajTimerKombo();
  ekranWyniki.classList.add('ukryty');
  ekranMenu.classList.remove('ukryty');
}

// ===========================================
// EVENTY MENU
// ===========================================

el('btnGraj').addEventListener('click', rozpocznijGre);
el('btnJeszczeRaz').addEventListener('click', rozpocznijGre);
el('btnDoMenu').addEventListener('click', wrocDoMenu);
el('btnMenu').addEventListener('click', pokazWyniki);

// wybór poziomu
el('przyciskiPoziomu').querySelectorAll('.pigulka').forEach(btn => {
  btn.addEventListener('click', () => {
    el('przyciskiPoziomu').querySelectorAll('.pigulka').forEach(b => b.classList.remove('aktywny'));
    btn.classList.add('aktywny');
    stan.poziom = btn.dataset.poziom;
  });
});

// wybór operatorów
el('przyciskiDzialan').querySelectorAll('.przycisk-dzialania').forEach(btn => {
  btn.addEventListener('click', () => {
    btn.classList.toggle('aktywny');
    const aktywne = [...el('przyciskiDzialan').querySelectorAll('.przycisk-dzialania.aktywny')].map(b => b.dataset.op);
    if (!aktywne.length) { btn.classList.add('aktywny'); return; } // min 1 operator
    stan.aktywneOperatory = aktywne;
  });
});

// wybór trybów gry
el('listaTrybow').querySelectorAll('.tryb').forEach(btn => {
  btn.addEventListener('click', () => {
    btn.classList.toggle('aktywny');
    const aktywne = [...el('listaTrybow').querySelectorAll('.tryb.aktywny')].map(b => b.dataset.tryb);
    if (!aktywne.length) { btn.classList.add('aktywny'); return; } // min 1 tryb
    stan.aktywneTypy = aktywne;
    // wyszarz opcje działań jeśli tryb działania nie jest wybrany
    el('opcje-dzialan').classList.toggle('wyszarzony', !aktywne.includes('dzialania'));
  });
});

// ===========================================
// PWA — service worker
// ===========================================

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

// blokuj zoom na dotyk (wielopalcowy)
document.addEventListener('touchmove', e => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

// blokuj double-tap zoom
let ostatniDotyk = 0;
document.addEventListener('touchend', e => {
  const teraz = Date.now();
  if (teraz - ostatniDotyk < 280 && e.target.tagName !== 'INPUT') e.preventDefault();
  ostatniDotyk = teraz;
}, { passive: false });
</script>
