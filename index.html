<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080808">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="mat-hub">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>mat-hub</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080808;--s1:#161616;--s2:#1e1e1e;--s3:#262626;
  --b1:#2c2c2c;--b2:#3a3a3a;
  --t1:#dedede;--t2:#888;--t3:#484848;
  --ac:#c8c8c8;--gn:#4ade80;--rd:#f87171;--yl:#d4a017;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);
  --sr:env(safe-area-inset-right,0px);
}
html,body{height:100%;background:var(--bg)}
body{
  font-family:'DM Sans',sans-serif;color:var(--t1);
  min-height:100dvh;display:flex;flex-direction:column;
  align-items:center;overflow:hidden;
}

/* ── SCREENS ── */
.scr{
  position:fixed;inset:0;z-index:40;
  display:flex;flex-direction:column;align-items:center;
  background:var(--bg);
  /* równomierny rozkład: safe-area + stały margines */
  padding-top:calc(var(--st) + 56px);
  padding-bottom:calc(var(--sb) + 48px);
  padding-left:calc(var(--sl) + 24px);
  padding-right:calc(var(--sr) + 24px);
  overflow-y:auto;
  /* title na górze, reszta na środku, graj na dole */
  justify-content:space-between;
}
.scr.hide{display:none}

/* menu wewnętrzna struktura */
.menu-top{width:100%;max-width:340px;text-align:center;padding-bottom:8px}
.menu-mid{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;flex:1;justify-content:center}
.menu-bot{width:100%;max-width:340px;padding-top:8px}

.ttl{
  font-family:'DM Mono',monospace;
  font-size:clamp(38px,12vw,58px);
  font-weight:500;line-height:1;letter-spacing:-.03em;
}

/* config */
.blk{display:flex;flex-direction:column;gap:8px;align-items:center}
.blk-lbl{font-size:10px;color:var(--t3);letter-spacing:.18em;text-transform:uppercase}
.row{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.pl{
  background:var(--s1);border:1.5px solid var(--b1);border-radius:100px;
  padding:7px 18px;font-size:13px;color:var(--t2);
  cursor:pointer;touch-action:manipulation;user-select:none;
  transition:border-color .12s,color .12s,background .12s;
}
.pl.on{border-color:var(--ac);color:var(--ac);background:rgba(200,200,200,.07)}
.pl:active{opacity:.65}
.opl{
  background:var(--s1);border:1.5px solid var(--b1);border-radius:10px;
  width:54px;height:46px;font-family:'DM Mono',monospace;font-size:21px;
  color:var(--t2);cursor:pointer;text-align:center;line-height:46px;
  touch-action:manipulation;user-select:none;
  transition:border-color .12s,color .12s,background .12s;
}
.opl.on{border-color:var(--ac);color:var(--ac);background:rgba(200,200,200,.07)}
.opl:active{opacity:.65}
#arithOpts.dim{opacity:.3;pointer-events:none}

/* mode list */
.mlist{display:flex;flex-direction:column;gap:8px;width:100%}
.mitem{
  display:flex;align-items:center;gap:14px;
  background:var(--s1);border:1.5px solid var(--b1);border-radius:12px;
  padding:13px 16px;cursor:pointer;touch-action:manipulation;user-select:none;
  transition:border-color .12s,background .12s;
}
.mitem.on{border-color:var(--ac);background:rgba(200,200,200,.06)}
.mitem:active{opacity:.7}
.mitem-ico{font-family:'DM Mono',monospace;font-size:15px;width:34px;text-align:center;flex-shrink:0;color:var(--t2)}
.mitem.on .mitem-ico{color:var(--ac)}
.mitem-name{font-size:14px;font-weight:600;letter-spacing:.03em;color:var(--t1)}

/* buttons */
.btn{
  background:#fff;color:#111;border:none;border-radius:12px;
  padding:14px 0;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;
  cursor:pointer;touch-action:manipulation;
  transition:opacity .12s,transform .1s;width:100%;
}
.btn:active{opacity:.82;transform:scale(.98)}
.btn.ghost{background:none;border:1.5px solid var(--b2);color:var(--t1);font-weight:400}
.btn.ghost:active{opacity:.6}

/* end stats */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:310px}
.rbox{background:var(--s1);border:1.5px solid var(--b1);border-radius:12px;padding:14px;text-align:center}
.rval{font-family:'DM Mono',monospace;font-size:30px;font-weight:500;color:var(--t1);line-height:1}
.rlbl{font-size:10px;color:var(--t3);letter-spacing:.1em;margin-top:5px;text-transform:uppercase}

/* end screen */
.end-inner{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:310px;flex:1;justify-content:center}

/* ── GAME WRAP ── */
.wrap{
  width:100%;max-width:440px;
  display:flex;flex-direction:column;gap:9px;
  flex:1;min-height:0;
  padding:calc(var(--st)+20px) 16px calc(var(--sb)+8px);
}
.hdr{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.pts{font-family:'DM Mono',monospace;font-size:23px;font-weight:500;color:var(--t1)}
.mbtn{
  background:none;border:1.5px solid var(--b1);border-radius:8px;
  padding:5px 13px;font-size:11px;color:var(--t2);
  cursor:pointer;touch-action:manipulation;transition:opacity .12s;
}
.mbtn:active{opacity:.55}

/* streak */
.srow{display:flex;align-items:center;gap:7px;min-height:18px;flex-shrink:0}
.sdots{display:flex;gap:4px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--s2);border:1.5px solid var(--b1);transition:background .18s,border-color .18s}
.dot.on{background:var(--gn);border-color:var(--gn)}
.ctimer-wrap{flex:1;height:3px;background:var(--s2);border-radius:2px;overflow:hidden;margin:0 4px}
.ctimer-bar{height:100%;width:100%;border-radius:2px;background:var(--ac);transition:background .3s}
.ctimer-bar.low{background:var(--rd)}
.cmbo{margin-left:auto;font-size:11px;color:var(--ac);opacity:0;transition:opacity .2s;font-family:'DM Mono',monospace}
.cmbo.show{opacity:1}

/* card */
.card{
  background:var(--s1);border:1.5px solid var(--b1);border-radius:16px;
  padding:20px 18px 16px;text-align:center;
  position:relative;overflow:hidden;flex-shrink:0;transition:border-color .18s;
}
.card.ok{border-color:var(--gn)}
.card.err{border-color:var(--rd);animation:shk .24s}
@keyframes shk{0%,100%{transform:translateX(0)}30%{transform:translateX(-6px)}70%{transform:translateX(6px)}}
.qlbl{font-size:10px;color:var(--t3);letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px}
.qarith{font-family:'DM Mono',monospace;font-size:clamp(28px,9.5vw,50px);font-weight:500;line-height:1;color:var(--t1);letter-spacing:-.02em}
.qarith .op{color:var(--ac)}
.qarith .eq{color:var(--t3)}
.qarith .ans{color:var(--gn);transition:color .15s}
.qarith .ans.ph{color:var(--t3)}
.qpoly{font-family:'DM Mono',monospace;font-size:clamp(18px,5.5vw,30px);font-weight:500;color:var(--t1);line-height:1.3;letter-spacing:.01em}
sup{font-size:.58em;vertical-align:super;line-height:0}
.qfact{font-family:'DM Mono',monospace;font-size:clamp(13px,4vw,20px);color:var(--t2);margin-top:10px;line-height:1.4}
.blnk{display:inline-block;min-width:20px;border-bottom:1.5px solid var(--ac);color:var(--ac);text-align:center;padding:0 2px;font-weight:500;letter-spacing:0}
.pop{position:absolute;font-family:'DM Mono',monospace;font-size:19px;font-weight:500;pointer-events:none;opacity:0;z-index:5;top:50%;left:50%;transform:translate(-50%,-50%);white-space:nowrap}

/* answer fields */
.qrow{display:flex;gap:5px;align-items:stretch;margin-bottom:8px}
.qtabs{display:flex;gap:6px;margin-bottom:5px}
.qtab{flex:1;background:var(--s1);border:1.5px solid var(--b1);border-radius:8px;padding:7px 0;font-size:11px;color:var(--t2);cursor:pointer;text-align:center;touch-action:manipulation;user-select:none;transition:all .12s;font-family:'DM Mono',monospace}
.qtab.act{border-color:var(--ac);color:var(--ac);background:rgba(200,200,200,.07)}
.qtab:active{opacity:.65}
.qfld{flex:1;min-width:0;background:var(--s2);border:1.5px solid var(--b1);border-radius:10px;padding:9px 10px;cursor:pointer;touch-action:manipulation;display:flex;flex-direction:column;gap:2px;transition:border-color .15s}
.qfld.act{border-color:var(--ac)}
.qflbl{font-size:9px;color:var(--t3);letter-spacing:.1em;text-transform:uppercase}
.qfval{font-family:'DM Mono',monospace;font-size:clamp(16px,5vw,22px);font-weight:500;color:var(--t1);text-align:right;min-height:30px;display:flex;align-items:center;justify-content:flex-end}
.qfval.ph{color:var(--t3)}
.qsep{align-self:center;color:var(--t3);font-size:13px;flex-shrink:0;padding:0 1px}

/* numpad */
.np{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.nk{background:var(--s1);border:1.5px solid var(--b1);border-radius:10px;height:52px;font-family:'DM Mono',monospace;font-size:17px;color:var(--t1);cursor:pointer;text-align:center;line-height:52px;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:background .07s,transform .07s}
.nk:active{transform:scale(.9);background:var(--s3)}
.nk.sign{color:var(--yl)}
.nk.del{color:var(--rd)}
.nk.z2{grid-column:span 2}
.nk.go{background:#fff;color:#111;border-color:#fff;font-size:19px}
.nk.go:active{background:#ccc;transform:scale(.9)}
.nk.skip{font-size:11px;color:var(--t3);letter-spacing:.04em}
.nk.skip:active{color:var(--t2);transform:scale(.9)}

/* toast */
.lup{position:fixed;top:24%;left:50%;transform:translateX(-50%);font-family:'DM Mono',monospace;font-size:clamp(16px,5vw,24px);color:var(--ac);opacity:0;pointer-events:none;z-index:60;white-space:nowrap}
@keyframes la{0%{opacity:0;transform:translateX(-50%) scale(.7)}20%{opacity:1;transform:translateX(-50%) scale(1.05)}70%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) scale(.88)}}
.lup.show{animation:la 1.1s ease forwards}
</style>
</head>
<body>

<!-- ════ MENU ════ -->
<div class="scr" id="sMenu">
  <div class="menu-top">
    <div class="ttl">mat-hub</div>
  </div>

  <div class="menu-mid">
    <div class="mlist" id="modeCards">
      <div class="mitem on" data-m="arith">
        <div class="mitem-ico">±</div>
        <div class="mitem-name">Działania</div>
      </div>
      <div class="mitem on" data-m="quad">
        <div class="mitem-ico">x²</div>
        <div class="mitem-name">Rozkład</div>
      </div>
      <div class="mitem on" data-m="form">
        <div class="mitem-ico">f(x)</div>
        <div class="mitem-name">Wzory</div>
      </div>
    </div>

    <div class="blk" id="arithOpts">
      <div class="blk-lbl">Działania</div>
      <div class="row" id="opPills">
        <div class="opl on" data-op="+">+</div>
        <div class="opl on" data-op="−">−</div>
        <div class="opl on" data-op="×">×</div>
        <div class="opl on" data-op="÷">÷</div>
      </div>
    </div>

    <div class="blk">
      <div class="blk-lbl">Poziom</div>
      <div class="row" id="diffPills">
        <div class="pl on" data-d="easy">Łatwy</div>
        <div class="pl" data-d="medium">Średni</div>
        <div class="pl" data-d="hard">Trudny</div>
      </div>
    </div>
  </div>

  <div class="menu-bot">
    <button class="btn" id="btnStart">Graj</button>
  </div>
</div>

<!-- ════ WYNIKI ════ -->
<div class="scr hide" id="sEnd">
  <div class="end-inner">
    <div class="ttl" style="font-size:clamp(22px,7vw,34px)">wyniki</div>
    <div class="rgrid">
      <div class="rbox"><div class="rval" id="ePts">0</div><div class="rlbl">Punkty</div></div>
      <div class="rbox"><div class="rval" id="eAcc">—</div><div class="rlbl">Trafność</div></div>
      <div class="rbox"><div class="rval" id="eOk">0</div><div class="rlbl">Poprawne</div></div>
      <div class="rbox"><div class="rval" id="eBest">0</div><div class="rlbl">Max combo</div></div>
    </div>
    <div class="sub" id="eMsg" style="color:var(--yl)"></div>
    <button class="btn" id="btnAgain">Jeszcze raz</button>
    <button class="btn ghost" id="btnMenu">← Menu</button>
  </div>
</div>

<div class="lup" id="lup"></div>

<!-- ════ GRA ════ -->
<div class="wrap">
  <div class="hdr">
    <div class="pts" id="gPts">0</div>
    <div class="cmbo" id="cmbo" style="flex:1;text-align:center"></div>
    <button class="mbtn" id="btnBack">Menu</button>
  </div>
  <div class="srow">
    <div class="sdots" id="sdots"></div>
    <div class="ctimer-wrap" id="ctimerWrap" style="display:none">
      <div class="ctimer-bar" id="ctimerBar"></div>
    </div>
  </div>

  <div class="card" id="card">
    <div class="qlbl" id="qlbl"></div>
    <div id="vA"><div class="qarith" id="qA"></div></div>
    <div id="vQ" style="display:none">
      <div class="qpoly" id="qPoly"></div>
      <div class="qfact" id="qFact"></div>
    </div>
    <div id="vF" style="display:none">
      <div class="qpoly" id="qForm"></div>
      <div class="qfact" id="qFormFact"></div>
    </div>
    <div class="pop" id="pop"></div>
  </div>

  <!-- arith numpad -->
  <div id="uiA">
    <div class="np">
      <div class="nk" data-v="7">7</div><div class="nk" data-v="8">8</div><div class="nk" data-v="9">9</div><div class="nk sign" data-v="-">±</div>
      <div class="nk" data-v="4">4</div><div class="nk" data-v="5">5</div><div class="nk" data-v="6">6</div><div class="nk del" data-v="del">⌫</div>
      <div class="nk" data-v="1">1</div><div class="nk" data-v="2">2</div><div class="nk" data-v="3">3</div><div class="nk del" data-v="clr">C</div>
      <div class="nk z2" data-v="0">0</div><div class="nk skip" data-v="skip">skip</div><div class="nk go" data-v="ok">↵</div>
    </div>
  </div>

  <!-- quad numpad -->
  <div id="uiQ" style="display:none">
    <div class="qtabs">
      <div class="qtab act" data-qf="0">x₁</div>
      <div class="qtab" data-qf="1">x₂</div>
    </div>
    <div class="qrow">
      <div class="qfld act" id="qf0"><div class="qflbl">x₁</div><div class="qfval ph" id="qv0">?</div></div>
      <div class="qsep">·</div>
      <div class="qfld" id="qf1"><div class="qflbl">x₂</div><div class="qfval ph" id="qv1">?</div></div>
    </div>
    <div class="np">
      <div class="nk" data-qv="7">7</div><div class="nk" data-qv="8">8</div><div class="nk" data-qv="9">9</div><div class="nk sign" data-qv="-">±</div>
      <div class="nk" data-qv="4">4</div><div class="nk" data-qv="5">5</div><div class="nk" data-qv="6">6</div><div class="nk del" data-qv="del">⌫</div>
      <div class="nk" data-qv="1">1</div><div class="nk" data-qv="2">2</div><div class="nk" data-qv="3">3</div><div class="nk del" data-qv="clr">C</div>
      <div class="nk z2" data-qv="0">0</div><div class="nk skip" data-qv="skip">skip</div><div class="nk go" data-qv="ok">↵</div>
    </div>
  </div>

  <!-- form numpad -->
  <div id="uiF" style="display:none">
    <div class="qtabs" id="fTabs">
      <div class="qtab act" data-ff="0">b</div>
      <div class="qtab" data-ff="1">b</div>
      <div class="qtab" data-ff="2">b</div>
    </div>
    <div class="qrow">
      <div class="qfld act" id="ff0"><div class="qflbl" id="ffl0">b</div><div class="qfval ph" id="fv0">?</div></div>
      <div class="qsep" id="fsep0">·</div>
      <div class="qfld" id="ff1"><div class="qflbl" id="ffl1">b</div><div class="qfval ph" id="fv1">?</div></div>
      <div class="qsep" id="fsep1">·</div>
      <div class="qfld" id="ff2"><div class="qflbl" id="ffl2">b</div><div class="qfval ph" id="fv2">?</div></div>
    </div>
    <div class="np">
      <div class="nk" data-fv="7">7</div><div class="nk" data-fv="8">8</div><div class="nk" data-fv="9">9</div><div class="nk sign" data-fv="-">±</div>
      <div class="nk" data-fv="4">4</div><div class="nk" data-fv="5">5</div><div class="nk" data-fv="6">6</div><div class="nk del" data-fv="del">⌫</div>
      <div class="nk" data-fv="1">1</div><div class="nk" data-fv="2">2</div><div class="nk" data-fv="3">3</div><div class="nk del" data-fv="clr">C</div>
      <div class="nk z2" data-fv="0">0</div><div class="nk skip" data-fv="skip">skip</div><div class="nk go" data-fv="ok">↵</div>
    </div>
  </div>
</div>

<script>
/* ── CONFIG ── */
const CFG={
  easy:  {ar:[1,12],mu:[1,10],dv:[1,10],qMax:7, coef:[1],      negR:false,dbl:false},
  medium:{ar:[1,20],mu:[1,12],dv:[1,12],qMax:10,coef:[1,2,3],  negR:true, dbl:false},
  hard:  {ar:[1,30],mu:[2,15],dv:[2,15],qMax:12,coef:[1,2,3,5],negR:true, dbl:true },
};

/* ── STATE ── */
const S={
  pts:0,streak:0,best:0,ok:0,wrong:0,running:false,
  diff:'easy',ops:['+','−','×','÷'],modes:['arith','quad','form'],
  mul:1,mode:'arith',q:null,
  abuf:'',qbuf:['',''],qfocus:0,fbuf:[],ffocus:0,
};

/* ── DOM ── */
const $=id=>document.getElementById(id);
const gPts=$('gPts'),card=$('card'),pop=$('pop'),qlbl=$('qlbl');
const sdots=$('sdots'),cmbo=$('cmbo'),lup=$('lup');
const vA=$('vA'),uiA=$('uiA'),qA=$('qA');
const vQ=$('vQ'),uiQ=$('uiQ'),qPoly=$('qPoly'),qFact=$('qFact');
const vF=$('vF'),uiF=$('uiF'),qForm=$('qForm'),qFormFact=$('qFormFact');
const QFW=[$('qf0'),$('qf1')],QFV=[$('qv0'),$('qv1')];
const FFW=[$('ff0'),$('ff1'),$('ff2')],FFV=[$('fv0'),$('fv1'),$('fv2')];

for(let i=0;i<5;i++){const d=document.createElement('div');d.className='dot';sdots.appendChild(d);}
const DOTS=[...sdots.querySelectorAll('.dot')];

/* ── UTILS ── */
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const ABS=Math.abs;
const mu=v=>`<span style="color:var(--t2)">${v}</span>`;
const t3=v=>`<span style="color:var(--t3)">${v}</span>`;
const gn=v=>`<span style="color:var(--gn)">${v}</span>`;
const blnk=(v,id)=>`<span class="blnk"${id?` id="${id}"`:''}>${v||'?'}</span>`;

/* ── ROUTING ── */
function nextQ(){
  const pool=S.modes.length?S.modes:['arith'];
  S.mode=pick(pool);
  if(S.mode==='quad')genQuad();
  else if(S.mode==='form')genForm();
  else genArith();
  vA.style.display  =S.mode==='arith'?'':'none';
  vQ.style.display  =S.mode==='quad' ?'':'none';
  vF.style.display  =S.mode==='form' ?'':'none';
  uiA.style.display =S.mode==='arith'?'':'none';
  uiQ.style.display =S.mode==='quad' ?'':'none';
  uiF.style.display =S.mode==='form' ?'':'none';
}

/* ── ARITH ── */
function genArith(){
  const c=CFG[S.diff],ops=S.ops.length?S.ops:['+'],op=pick(ops);
  let a,b,ans;
  if(op==='+'){a=rnd(...c.ar);b=rnd(...c.ar);ans=a+b;}
  else if(op==='−'){a=rnd(...c.ar);b=rnd(...c.ar);if(b>a)[a,b]=[b,a];ans=a-b;}
  else if(op==='×'){a=rnd(...c.mu);b=rnd(...c.mu);ans=a*b;}
  else{b=rnd(2,c.dv[1]);ans=rnd(1,c.dv[1]);a=b*ans;}
  S.q={ans};S.abuf='';
  qlbl.textContent={'+':'Dodawanie','−':'Odejmowanie','×':'Mnożenie','÷':'Dzielenie'}[op];
  qA.innerHTML=`${a}<span class="op"> ${op} </span>${b}<span class="eq"> = </span><span class="ans ph" id="qAns">?</span>`;
}
function updArith(){
  const el=$('qAns');if(!el)return;
  el.textContent=S.abuf||'?';
  el.className='ans'+(S.abuf?'':' ph');
}

/* ── QUAD ── */
function genQuad(){
  const c=CFG[S.diff],coef=pick(c.coef);
  let r1=rnd(1,c.qMax)*(c.negR&&Math.random()<.5?-1:1);
  let r2=c.dbl&&Math.random()<.2?r1:rnd(1,c.qMax)*(c.negR&&Math.random()<.5?-1:1);
  if(!r1)r1=1;if(!r2)r2=1;
  const B=-coef*(r1+r2),C=coef*r1*r2;
  S.q={r1,r2,coef};S.qbuf=['',''];S.qfocus=0;
  qlbl.textContent='Miejsca zerowe';
  qPoly.innerHTML=buildPoly(coef,B,C);
  qFact.innerHTML=buildFact(r1,r2,coef,false);
  updQfocus();updQdisp();
}
function buildPoly(coef,B,C){
  let s=coef===1?`x<sup>2</sup>`:coef===-1?`−x<sup>2</sup>`:`${coef}x<sup>2</sup>`;
  if(B){const sg=B>0?'+':'−';s+=` ${mu(sg)} ${ABS(B)===1?'x':`${ABS(B)}x`}`;}
  if(C){s+=` ${mu(C>0?'+':'−')} ${ABS(C)}`;}
  return s+` ${t3('= 0')}`;
}
function buildFact(r1,r2,coef,reveal){
  const pre=coef===1?'':`${coef}`;
  const br=(r,idx)=>{
    if(!ABS(r))return'(x)';
    const term=` ${mu(r>0?'−':'+')} `;
    return reveal?`(x${term}${gn(ABS(r))})`: `(x${term}${blnk(S.qbuf[idx]||'?',`fb${idx}`)})`;
  };
  if(r1===r2&&reveal)
    return `${pre}(x ${mu(r1>0?'−':'+')} ${gn(ABS(r1))})<sup>2</sup> ${t3('= 0')}`;
  return `${pre}${br(r1,0)}${br(r2,1)} ${t3('= 0')}`;
}
function updQdisp(){
  for(let i=0;i<2;i++){const v=S.qbuf[i];QFV[i].textContent=v||'?';QFV[i].className='qfval'+(v?'':' ph');}
  if(S.q)qFact.innerHTML=buildFact(S.q.r1,S.q.r2,S.q.coef,false);
}
function updQfocus(){
  for(let i=0;i<2;i++)QFW[i].className='qfld'+(S.qfocus===i?' act':'');
  document.querySelectorAll('.qtab[data-qf]').forEach((t,i)=>t.classList.toggle('act',i===S.qfocus));
}

/* ── FORM ──
   Typy:  0=(ax+b)²  1=(ax-b)²  2=(ax+b)(ax-b)  3=(x+b)³ [hard]
   Dir:   0=złóż(wpisz składniki)  1=rozpisz(wpisz rozwinięcie)
*/
function genForm(){
  const c=CFG[S.diff],maxB=Math.min(c.qMax,9),b=rnd(2,maxB);
  const type=rnd(0,S.diff==='hard'?3:2),dir=rnd(0,1);
  const a=dir===0&&type<=2&&S.diff!=='easy'?pick([1,1,2,3]):1;
  const a2=a*a,b2=b*b,ab2=2*a*b,ax=a===1?'x':`${a}x`;
  let expand,factored,label,ans;

  if(type===0){
    expand=`${a2===1?'x':a2+'x'}<sup>2</sup> ${mu('+')} ${ab2}x ${mu('+')} ${b2}`;
    factored=`(${ax} ${mu('+')} ${b})<sup>2</sup>`;
    label='(ax+b)²';
    ans=dir===0?(a===1?[b]:[a,b]):[a2,ab2,b2];
  }else if(type===1){
    expand=`${a2===1?'x':a2+'x'}<sup>2</sup> ${mu('−')} ${ab2}x ${mu('+')} ${b2}`;
    factored=`(${ax} ${mu('−')} ${b})<sup>2</sup>`;
    label='(ax−b)²';
    ans=dir===0?(a===1?[b]:[a,b]):[a2,ab2,b2];
  }else if(type===2){
    expand=`${a2===1?'x':a2+'x'}<sup>2</sup> ${mu('−')} ${b2}`;
    factored=`(${ax} ${mu('+')} ${b})(${ax} ${mu('−')} ${b})`;
    label='(ax+b)(ax−b)';
    ans=dir===0?(a===1?[b]:[a,b]):[a2,b2];
  }else{
    const _3b=3*b,_3b2=3*b2,b3=b2*b;
    expand=`x<sup>3</sup> ${mu('+')} ${_3b}x<sup>2</sup> ${mu('+')} ${_3b2}x ${mu('+')} ${b3}`;
    factored=`(x ${mu('+')} ${b})<sup>3</sup>`;
    label='(x+b)³';
    ans=dir===0?[b]:[_3b,_3b2,b3];
  }

  const flds=dir===0
    ?(ans.length===1?['b']:['a','b'])
    :(ans.length===2?['a²','b²']:(type===3?['3b','3b²','b³']:['a²','2ab','b²']));

  S.q={a,b,type,dir,ans,flds};
  S.fbuf=ans.map(()=>'');
  S.ffocus=0;

  qlbl.textContent=dir===0?`złóż → ${label}`:`rozpisz ${label}`;
  qForm.innerHTML=(dir===0?expand:factored)+` ${t3('= ?')}`;

  // show exactly n fields
  const n=ans.length;
  [0,1,2].forEach(i=>{
    const show=i<n;
    FFW[i].style.display=show?'':'none';
    if(show)FFW[i].querySelector('.qflbl').textContent=flds[i];
  });
  const s0=$('fsep0'),s1=$('fsep1');
  s0.style.display=n>=2?'':'none';
  s1.style.display=n>=3?'':'none';
  const tabs=$('fTabs').querySelectorAll('.qtab');
  tabs.forEach((t,i)=>{t.style.display=i<n?'':'none';t.textContent=flds[i]||'';});

  updFfocus();updFdisp();
}

function updFdisp(){
  if(!S.q||S.mode!=='form')return;
  const{ans,flds,dir,type,a,b}=S.q,n=ans.length;
  for(let i=0;i<n;i++){const v=S.fbuf[i];FFV[i].textContent=v||'?';FFV[i].className='qfval'+(v?'':' ph');}
  // update blanks in card
  const ax=a===1?'x':`${a}x`,bv=i=>S.fbuf[i]||'?';
  if(dir===0){
    const bVal=n===1?blnk(bv(0),'fb0'):blnk(bv(1),'fb1');
    const xp=n>=2?`${blnk(bv(0),'fb0')}x`:'x';
    if(type===0)      qFormFact.innerHTML=`(${xp} ${mu('+')} ${bVal})<sup>2</sup>`;
    else if(type===1) qFormFact.innerHTML=`(${xp} ${mu('−')} ${bVal})<sup>2</sup>`;
    else if(type===2) qFormFact.innerHTML=`(${xp} ${mu('+')} ${bVal})(${xp} ${mu('−')} ${bVal})`;
    else              qFormFact.innerHTML=`(x ${mu('+')} ${blnk(bv(0),'fb0')})<sup>3</sup>`;
  }else{
    if(type===0||type===1){
      const sg=type===0?'+':'−';
      qFormFact.innerHTML=`${blnk(bv(0),'fb0')}x<sup>2</sup> ${mu(sg)} ${blnk(bv(1),'fb1')}x ${mu('+')} ${blnk(bv(2),'fb2')}`;
    }else if(type===2){
      qFormFact.innerHTML=`${blnk(bv(0),'fb0')}x<sup>2</sup> ${mu('−')} ${blnk(bv(1),'fb1')}`;
    }else{
      qFormFact.innerHTML=`x<sup>3</sup> ${mu('+')} ${blnk(bv(0),'fb0')}x<sup>2</sup> ${mu('+')} ${blnk(bv(1),'fb1')}x ${mu('+')} ${blnk(bv(2),'fb2')}`;
    }
  }
}
function updFfocus(){
  const n=S.q?S.q.ans.length:1;
  [0,1,2].forEach(i=>{if(i<n)FFW[i].className='qfld'+(i===S.ffocus?' act':'');});
  $('fTabs').querySelectorAll('.qtab').forEach((t,i)=>t.classList.toggle('act',i===S.ffocus));
}

/* ── REVEAL ── */
function revealArith(){
  const el=$('qAns');if(el){el.textContent=S.q.ans;el.className='ans';}
}
function revealQuad(){
  qFact.innerHTML=buildFact(S.q.r1,S.q.r2,S.q.coef,true);
}
function revealForm(){
  const{a,b,type,dir,ans}=S.q,ax=a===1?'x':`${gn(a)}x`;
  if(dir===0){
    if(type===0)      qFormFact.innerHTML=`(${ax} ${mu('+')} ${gn(b)})<sup>2</sup>`;
    else if(type===1) qFormFact.innerHTML=`(${ax} ${mu('−')} ${gn(b)})<sup>2</sup>`;
    else if(type===2) qFormFact.innerHTML=`(${ax} ${mu('+')} ${gn(b)})(${ax} ${mu('−')} ${gn(b)})`;
    else              qFormFact.innerHTML=`(x ${mu('+')} ${gn(b)})<sup>3</sup>`;
  }else{
    if(type===0||type===1){
      const sg=type===0?'+':'−';
      qFormFact.innerHTML=`${gn(ans[0])}x<sup>2</sup> ${mu(sg)} ${gn(ans[1])}x ${mu('+')} ${gn(ans[2])}`;
    }else if(type===2){
      qFormFact.innerHTML=`${gn(ans[0])}x<sup>2</sup> ${mu('−')} ${gn(ans[1])}`;
    }else{
      qFormFact.innerHTML=`x<sup>3</sup> ${mu('+')} ${gn(ans[0])}x<sup>2</sup> ${mu('+')} ${gn(ans[1])}x ${mu('+')} ${gn(ans[2])}`;
    }
  }
}

/* ── SUBMIT ── */
function submitA(){
  if(!S.running)return;
  const v=parseInt(S.abuf);
  if(S.abuf===''||S.abuf==='-'||isNaN(v))return;
  if(v===S.q.ans){hit();setTimeout(()=>{if(S.running)nextQ();},160);}
  else{miss();revealArith();setTimeout(()=>{if(S.running)nextQ();},950);}
  S.abuf='';updArith();
}
function submitQ(){
  if(!S.running)return;
  const v0=parseInt(S.qbuf[0]),v1=parseInt(S.qbuf[1]);
  if(isNaN(v0)||isNaN(v1))return;
  const{r1,r2,coef}=S.q,a0=ABS(r1),a1=ABS(r2);
  if((v0===a0&&v1===a1)||(v0===a1&&v1===a0)){hit();setTimeout(()=>{if(S.running)nextQ();},160);}
  else{miss();revealQuad();setTimeout(()=>{if(S.running)nextQ();},1200);}
}
function submitF(){
  if(!S.running)return;
  const{ans}=S.q,n=ans.length,vals=[];
  for(let i=0;i<n;i++){const v=parseInt(S.fbuf[i]);if(isNaN(v))return;vals.push(v);}
  if(ans.every((a,i)=>vals[i]===a)){hit();setTimeout(()=>{if(S.running)nextQ();},160);}
  else{miss();revealForm();setTimeout(()=>{if(S.running)nextQ();},1400);}
}
function skip(){
  if(!S.running)return;
  miss();
  if(S.mode==='arith')revealArith();
  else if(S.mode==='quad')revealQuad();
  else revealForm();
  setTimeout(()=>{if(S.running)nextQ();},1100);
}

/* ── HIT / MISS ── */
function hit(){
  S.streak++;S.ok++;
  if(S.streak>S.best)S.best=S.streak;
  S.mul=Math.floor(S.streak/5)+1;
  const pts=(S.mode==='arith'?10:20)*S.mul;
  S.pts+=pts;gPts.textContent=S.pts;
  popAnim('+'+pts,'var(--gn)');flash('ok');updStreak();vib(22);
  if(S.streak>0&&S.streak%5===0)toast(`×${S.mul} combo`);
}
function miss(){
  S.wrong++;S.streak=0;S.mul=1;
  popAnim('✕','var(--rd)');flash('err');updStreak();vib([40,15,40]);
}
function popAnim(txt,col){
  pop.textContent=txt;pop.style.color=col;
  pop.style.transition='none';pop.style.opacity='1';pop.style.transform='translate(-50%,-50%) scale(1)';
  requestAnimationFrame(()=>{
    pop.style.transition='opacity .48s,transform .48s';
    pop.style.opacity='0';pop.style.transform='translate(-50%,-70%) scale(1.3)';
  });
}
function flash(c){
  card.classList.remove('ok','err');void card.offsetWidth;
  card.classList.add(c);setTimeout(()=>card.classList.remove(c),300);
}
function updStreak(){
  const p=S.streak%5;
  DOTS.forEach((d,i)=>d.classList.toggle('on',i<(S.streak>0&&p===0?5:p)));
  if(S.mul>=2){cmbo.textContent=`×${S.mul}`;cmbo.classList.add('show');startComboTimer();}
  else{cmbo.classList.remove('show');stopComboTimer();}
}
function toast(msg){lup.textContent=msg;lup.classList.remove('show');void lup.offsetWidth;lup.classList.add('show');}
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(_){}}

/* ── COMBO TIMER ── */
const COMBO_SEC=8;let _cInt=null,_cLeft=0;
function startComboTimer(){
  clearInterval(_cInt);_cLeft=COMBO_SEC;
  $('ctimerWrap').style.display='';
  const bar=$('ctimerBar');
  bar.classList.remove('low');bar.style.transition='none';bar.style.width='100%';
  _cInt=setInterval(()=>{
    _cLeft-=.1;
    bar.style.transition='width .1s linear';
    bar.style.width=Math.max(0,_cLeft/COMBO_SEC*100)+'%';
    if(_cLeft<=2)bar.classList.add('low');
    if(_cLeft<=0){
      clearInterval(_cInt);$('ctimerWrap').style.display='none';
      if(S.streak>=5){S.streak=0;S.mul=1;updStreak();}
    }
  },100);
}
function stopComboTimer(){clearInterval(_cInt);$('ctimerWrap').style.display='none';}

/* ── KEY HANDLERS ── */
function aKey(v){
  if(!S.running||S.mode!=='arith')return;
  if(v==='ok'){submitA();return;}
  if(v==='skip'){skip();return;}
  if(v==='clr'){S.abuf='';updArith();return;}
  if(v==='del'){S.abuf=S.abuf.slice(0,-1);updArith();return;}
  if(v==='-'){
    S.abuf=!S.abuf?'-':S.abuf==='-'?'':S.abuf[0]==='-'?S.abuf.slice(1):'-'+S.abuf;
    updArith();return;
  }
  if(S.abuf.replace('-','').length<4){S.abuf+=v;updArith();}
}
function qKey(v){
  if(!S.running||S.mode!=='quad')return;
  if(v==='ok'){submitQ();return;}
  if(v==='skip'){skip();return;}
  const f=S.qfocus;
  if(v==='clr'){S.qbuf[f]='';updQdisp();return;}
  if(v==='del'){S.qbuf[f]=S.qbuf[f].slice(0,-1);updQdisp();return;}
  if(v==='-'){
    S.qbuf[f]=!S.qbuf[f]?'-':S.qbuf[f]==='-'?'':S.qbuf[f][0]==='-'?S.qbuf[f].slice(1):'-'+S.qbuf[f];
    updQdisp();return;
  }
  if(S.qbuf[f].replace('-','').length<3){S.qbuf[f]+=v;updQdisp();}
}
function fKey(v){
  if(!S.running||S.mode!=='form')return;
  if(v==='ok'){submitF();return;}
  if(v==='skip'){skip();return;}
  const f=S.ffocus;
  if(v==='clr'){S.fbuf[f]='';updFdisp();return;}
  if(v==='del'){S.fbuf[f]=S.fbuf[f].slice(0,-1);updFdisp();return;}
  if(v==='-')return;
  if(S.fbuf[f].length<4){S.fbuf[f]+=v;updFdisp();}
}

/* ── GAME FLOW ── */
function startGame(){
  $('sMenu').classList.add('hide');$('sEnd').classList.add('hide');
  Object.assign(S,{pts:0,streak:0,best:0,ok:0,wrong:0,mul:1,running:true,
    abuf:'',qbuf:['',''],qfocus:0,fbuf:[],ffocus:0});
  gPts.textContent='0';
  DOTS.forEach(d=>d.classList.remove('on'));
  cmbo.classList.remove('show');
  stopComboTimer();nextQ();
}
function showResults(){
  S.running=false;stopComboTimer();
  $('ePts').textContent=S.pts;$('eOk').textContent=S.ok;$('eBest').textContent=S.best;
  const tot=S.ok+S.wrong;
  $('eAcc').textContent=tot?Math.round(S.ok/tot*100)+'%':'—';
  const msgs=[[0,'Ćwicz dalej!'],[80,'Nieźle!'],[200,'Świetnie!'],[450,'Rewelacja!'],[800,'Legenda!']];
  let m='';for(const[t,msg]of msgs)if(S.pts>=t)m=msg;
  $('eMsg').textContent=m;
  $('sEnd').classList.remove('hide');
}
function goMenu(){
  S.running=false;stopComboTimer();
  $('sEnd').classList.add('hide');$('sMenu').classList.remove('hide');
}

/* ── EVENTS ── */
uiA.addEventListener('pointerdown',e=>{
  const b=e.target.closest('[data-v]');if(!b)return;e.preventDefault();aKey(b.dataset.v);
});
uiQ.addEventListener('pointerdown',e=>{
  const b=e.target.closest('[data-qv]');if(!b)return;e.preventDefault();qKey(b.dataset.qv);
});
uiF.addEventListener('pointerdown',e=>{
  const b=e.target.closest('[data-fv]');if(!b)return;e.preventDefault();fKey(b.dataset.fv);
});

[0,1].forEach(i=>{
  QFW[i].addEventListener('pointerdown',e=>{e.preventDefault();S.qfocus=i;updQfocus();});
});
document.querySelectorAll('.qtab[data-qf]').forEach((t,i)=>{
  t.addEventListener('pointerdown',e=>{e.preventDefault();S.qfocus=i;updQfocus();});
});
[0,1,2].forEach(i=>{
  FFW[i].addEventListener('pointerdown',e=>{
    if(!S.q||i>=S.q.ans.length)return;
    e.preventDefault();S.ffocus=i;updFfocus();
  });
});
document.querySelectorAll('.qtab[data-ff]').forEach((t,i)=>{
  t.addEventListener('pointerdown',e=>{
    if(!S.q)return;e.preventDefault();
    S.ffocus=i%S.q.ans.length;updFfocus();updFdisp();
  });
});

$('btnStart').addEventListener('click',startGame);
$('btnAgain').addEventListener('click',startGame);
$('btnMenu').addEventListener('click',goMenu);
$('btnBack').addEventListener('click',showResults);

document.querySelectorAll('#diffPills .pl').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('#diffPills .pl').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');S.diff=b.dataset.d;
  });
});
document.querySelectorAll('#opPills .opl').forEach(b=>{
  b.addEventListener('click',()=>{
    b.classList.toggle('on');
    const a=[...document.querySelectorAll('#opPills .opl.on')].map(x=>x.dataset.op);
    if(!a.length){b.classList.add('on');return;}S.ops=a;
  });
});
document.querySelectorAll('#modeCards .mitem').forEach(b=>{
  b.addEventListener('click',()=>{
    b.classList.toggle('on');
    const a=[...document.querySelectorAll('#modeCards .mitem.on')].map(x=>x.dataset.m);
    if(!a.length){b.classList.add('on');return;}S.modes=a;
    $('arithOpts').classList.toggle('dim',a.every(m=>m!=='arith'));
  });
});

document.addEventListener('keydown',e=>{
  if(!S.running)return;
  if(e.key>='0'&&e.key<='9'){
    S.mode==='arith'?aKey(e.key):S.mode==='quad'?qKey(e.key):fKey(e.key);
  }else if(e.key==='-'){
    if(S.mode==='arith')aKey('-');else if(S.mode==='quad')qKey('-');
  }else if(e.key==='Backspace'){
    e.preventDefault();
    S.mode==='arith'?aKey('del'):S.mode==='quad'?qKey('del'):fKey('del');
  }else if(e.key==='Enter'||e.key===' '){
    e.preventDefault();
    S.mode==='arith'?submitA():S.mode==='quad'?submitQ():submitF();
  }else if(e.key==='Escape'){
    if(S.mode==='arith'){S.abuf='';updArith();}
    else if(S.mode==='quad'){S.qbuf[S.qfocus]='';updQdisp();}
    else{S.fbuf[S.ffocus]='';updFdisp();}
  }else if(e.key==='Tab'){
    e.preventDefault();
    if(S.mode==='quad'){S.qfocus=(S.qfocus+1)%2;updQfocus();}
    else if(S.mode==='form'&&S.q){S.ffocus=(S.ffocus+1)%S.q.ans.length;updFfocus();updFdisp();}
  }
});

/* ── PWA ── */
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
let _lt=0;
document.addEventListener('touchend',e=>{
  const n=Date.now();
  if(n-_lt<280&&e.target.tagName!=='INPUT')e.preventDefault();
  _lt=n;
},{passive:false});
</script>
