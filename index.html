<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080808">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="mat-hub">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>mat-hub</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Referencja do zewnętrznych stylów CSS -->
<link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- ==========================================
     EKRAN MENU GŁÓWNEGO
     ========================================== -->
<div class="ekran" id="ekranMenu">

  <div class="tytul">mat-hub</div>

  <div class="menu-srodek">

    <!-- wybór trybów gry -->
    <div class="lista-trybow" id="listaTrybow">
      <div class="tryb aktywny" data-tryb="dzialania">
        <div class="tryb-ikona">±</div>
        <div class="tryb-nazwa">Działania</div>
      </div>
      <div class="tryb aktywny" data-tryb="rozklad">
        <div class="tryb-ikona">x²</div>
        <div class="tryb-nazwa">Rozkład</div>
      </div>
      <div class="tryb aktywny" data-tryb="wzory">
        <div class="tryb-ikona">f(x)</div>
        <div class="tryb-nazwa">Wzory</div>
      </div>
      <div class="tryb aktywny" data-tryb="pitagoras">
        <div class="tryb-ikona">△</div>
        <div class="tryb-nazwa">Pitagoras</div>
      </div>
    </div>

    <!-- opcje działań (widoczne tylko gdy tryb "działania" aktywny) -->
    <div class="blok" id="opcje-dzialan">
      <div class="blok-etykieta">Działania</div>
      <div class="rzad" id="przyciskiDzialan">
        <div class="przycisk-dzialania aktywny" data-op="+">+</div>
        <div class="przycisk-dzialania aktywny" data-op="−">−</div>
        <div class="przycisk-dzialania aktywny" data-op="×">×</div>
        <div class="przycisk-dzialania aktywny" data-op="÷">÷</div>
      </div>
    </div>

    <!-- poziom trudności -->
    <div class="blok">
      <div class="blok-etykieta">Poziom</div>
      <div class="rzad" id="przyciskiPoziomu">
        <div class="pigulka aktywny" data-poziom="latwy">Łatwy</div>
        <div class="pigulka" data-poziom="sredni">Średni</div>
        <div class="pigulka" data-poziom="trudny">Trudny</div>
      </div>
    </div>

  </div>

  <div class="menu-dol">
    <button class="btn" id="btnGraj">Graj</button>
  </div>

</div>

<!-- ==========================================
     EKRAN WYNIKÓW
     ========================================== -->
<div class="ekran ukryty" id="ekranWyniki">
  <div class="koniec-srodek">
    <div class="tytul" style="font-size: clamp(22px,7vw,34px)">wyniki</div>
    <div class="siatka-wynikow">
      <div class="kafelek-wyniku"><div class="wartosc-wyniku" id="wynikPunkty">0</div><div class="etykieta-wyniku">Punkty</div></div>
      <div class="kafelek-wyniku"><div class="wartosc-wyniku" id="wynikTrafinosc">—</div><div class="etykieta-wyniku">Trafność</div></div>
      <div class="kafelek-wyniku"><div class="wartosc-wyniku" id="wynikPoprawne">0</div><div class="etykieta-wyniku">Poprawne</div></div>
      <div class="kafelek-wyniku"><div class="wartosc-wyniku" id="wynikKombo">0</div><div class="etykieta-wyniku">Max combo</div></div>
    </div>
    <div style="font-size:13px;color:var(--zolty);text-align:center" id="wynikKomunikat"></div>
    <button class="btn" id="btnJeszczeRaz">Jeszcze raz</button>
    <button class="btn duch" id="btnDoMenu">←  Menu</button>
  </div>
</div>

<!-- toast na combo -->
<div class="toast" id="toast"></div>

<!-- ==========================================
     OBSZAR GRY
     ========================================== -->
<div class="wrap">

  <!-- nagłówek: punkty / combo / menu -->
  <div class="naglowek">
    <div class="punkty" id="licznikPunktow">0</div>
    <div class="combo" id="wyswietlaczKombo"></div>
    <button class="przycisk-menu" id="btnMenu">Menu</button>
  </div>

  <!-- pasek streak (5 kropek) -->
  <div class="rzad-streak">
    <div class="kropki-streak" id="kropkiStreak"></div>
    <div class="pasek-combo-wrap" id="paselKomboWrap" style="display:none">
      <div class="pasek-combo" id="pasekKombo"></div>
    </div>
  </div>

  <!-- karta z pytaniem -->
  <div class="karta" id="karta">
    <div class="etykieta-pytania" id="etykietaPytania"></div>

    <!-- widok: działania arytmetyczne -->
    <div id="widokDzialania">
      <div class="pytanie-arytm" id="pytanieArytm"></div>
    </div>

    <!-- widok: rozkład kwadratowy -->
    <div id="widokRozklad" style="display:none">
      <div class="pytanie-poly" id="pytanieWielomian"></div>
      <div class="podpowiedz-iloczynowa" id="podpowiedzIloczynowa"></div>
    </div>

    <!-- widok: wzory skróconego mnożenia -->
    <div id="widokWzory" style="display:none">
      <div class="pytanie-poly" id="pytanieWzor"></div>
      <div class="podpowiedz-iloczynowa" id="podpowiedzWzor"></div>
    </div>

    <!-- widok: twierdzenie Pitagorasa -->
    <div id="widokPitagoras" style="display:none">
      <div class="pytanie-poly" id="pytaniePitagoras"></div>
      <!-- SVG trójkąt rysowany dynamicznie -->
      <svg class="trojkat-svg" id="trojkatSVG" viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <!-- animacja pop (np. "+20") -->
    <div class="pop-animacja" id="popAnimacja"></div>
  </div>

  <!-- ── KLAWIATURA: działania (jedno pole) ── -->
  <div id="klawiaturaDzialania">
    <div class="klawiatura">
      <div class="klawisz" data-akcja="7">7</div>
      <div class="klawisz" data-akcja="8">8</div>
      <div class="klawisz" data-akcja="9">9</div>
      <div class="klawisz znak" data-akcja="-">±</div>
      <div class="klawisz" data-akcja="4">4</div>
      <div class="klawisz" data-akcja="5">5</div>
      <div class="klawisz" data-akcja="6">6</div>
      <div class="klawisz kasowanie" data-akcja="del">⌫</div>
      <div class="klawisz" data-akcja="1">1</div>
      <div class="klawisz" data-akcja="2">2</div>
      <div class="klawisz" data-akcja="3">3</div>
      <div class="klawisz kasowanie" data-akcja="clr">C</div>
      <div class="klawisz szerokie" data-akcja="0">0</div>
      <div class="klawisz pominij" data-akcja="skip">skip</div>
      <div class="klawisz zatwierdz" data-akcja="ok">↵</div>
    </div>
  </div>

  <!-- ── KLAWIATURA: dwa pola (rozkład / pitagoras) ── -->
  <div id="klawiaturaPolaA" style="display:none">
    <div class="taby-pol" id="tabyA">
      <div class="tab-pola aktywny" data-pole="0">x₁</div>
      <div class="tab-pola" data-pole="1">x₂</div>
    </div>
    <div class="rzad-pol">
      <div class="pole-odpowiedzi aktywny" id="poleA0">
        <div class="etykieta-pola" id="etA0">x₁</div>
        <div class="wartosc-pola placeholder" id="valA0">?</div>
      </div>
      <div class="separator-pol">·</div>
      <div class="pole-odpowiedzi" id="poleA1">
        <div class="etykieta-pola" id="etA1">x₂</div>
        <div class="wartosc-pola placeholder" id="valA1">?</div>
      </div>
    </div>
    <div class="klawiatura">
      <div class="klawisz" data-b="7">7</div>
      <div class="klawisz" data-b="8">8</div>
      <div class="klawisz" data-b="9">9</div>
      <div class="klawisz znak" data-b="-">±</div>
      <div class="klawisz" data-b="4">4</div>
      <div class="klawisz" data-b="5">5</div>
      <div class="klawisz" data-b="6">6</div>
      <div class="klawisz kasowanie" data-b="del">⌫</div>
      <div class="klawisz" data-b="1">1</div>
      <div class="klawisz" data-b="2">2</div>
      <div class="klawisz" data-b="3">3</div>
      <div class="klawisz kasowanie" data-b="clr">C</div>
      <div class="klawisz szerokie" data-b="0">0</div>
      <div class="klawisz pominij" data-b="skip">skip</div>
      <div class="klawisz zatwierdz" data-b="ok">↵</div>
    </div>
  </div>

  <!-- ── KLAWIATURA: trzy pola (wzory) ── -->
  <div id="klawiaturaPolaB" style="display:none">
    <div class="taby-pol" id="tabyB">
      <div class="tab-pola aktywny" data-pole="0">b</div>
      <div class="tab-pola" data-pole="1">b</div>
      <div class="tab-pola" data-pole="2">b</div>
    </div>
    <div class="rzad-pol">
      <div class="pole-odpowiedzi aktywny" id="poleB0">
        <div class="etykieta-pola" id="etB0">b</div>
        <div class="wartosc-pola placeholder" id="valB0">?</div>
      </div>
      <div class="separator-pol" id="sepB0">·</div>
      <div class="pole-odpowiedzi" id="poleB1">
        <div class="etykieta-pola" id="etB1">b</div>
        <div class="wartosc-pola placeholder" id="valB1">?</div>
      </div>
      <div class="separator-pol" id="sepB1">·</div>
      <div class="pole-odpowiedzi" id="poleB2">
        <div class="etykieta-pola" id="etB2">b</div>
        <div class="wartosc-pola placeholder" id="valB2">?</div>
      </div>
    </div>
    <div class="klawiatura">
      <div class="klawisz" data-c="7">7</div>
      <div class="klawisz" data-c="8">8</div>
      <div class="klawisz" data-c="9">9</div>
      <div class="klawisz znak" data-c="-">±</div>
      <div class="klawisz" data-c="4">4</div>
      <div class="klawisz" data-c="5">5</div>
      <div class="klawisz" data-c="6">6</div>
      <div class="klawisz kasowanie" data-c="del">⌫</div>
      <div class="klawisz" data-c="1">1</div>
      <div class="klawisz" data-c="2">2</div>
      <div class="klawisz" data-c="3">3</div>
      <div class="klawisz kasowanie" data-c="clr">C</div>
      <div class="klawisz szerokie" data-c="0">0</div>
      <div class="klawisz pominij" data-c="skip">skip</div>
      <div class="klawisz zatwierdz" data-c="ok">↵</div>
    </div>
  </div>

</div><!-- koniec .wrap -->

<!-- Referencje do aplikacji z modułów -->
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/modes/dzialania.js"></script>
<script src="js/modes/rozklad.js"></script>
<script src="js/modes/wzory.js"></script>
<script src="js/modes/pitagoras.js"></script>
<script src="js/app.js"></script>
<script src="js/keyboard.js"></script>

</body>
</html>
