<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111116">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="mat-hub">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>mat-hub</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0a;--s1:#141414;--s2:#1c1c1c;--s3:#242424;
  --b1:#2a2a2a;--b2:#383838;--b3:#484848;
  --t1:#dedede;--t2:#888888;--t3:#4a4a4a;
  --ac:#c8c8c8;--gn:#4ade80;--rd:#f87171;--yl:#d4a017;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);
  --sr:env(safe-area-inset-right,0px);
}
html{height:100%;background:var(--bg)}
body{
  font-family:'DM Sans',sans-serif;color:var(--t1);
  min-height:100%;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  overflow:hidden;
  padding:
    calc(var(--st) + 10px)
    calc(var(--sr) + 16px)
    calc(var(--sb) + 8px)
    calc(var(--sl) + 16px);
}

/* ── OVERLAY SCREENS ── */
.scr{
  position:fixed;inset:0;z-index:40;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;background:var(--bg);
  padding:32px 28px calc(32px + var(--sb));
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.scr.hide{display:none}

/* typography */
.ttl{
  font-family:'DM Mono',monospace;font-size:clamp(28px,9vw,44px);
  font-weight:500;text-align:center;line-height:1.1;letter-spacing:-.03em;
}
.sub{font-size:13px;color:var(--t2);text-align:center;max-width:280px;line-height:1.75}

/* config blocks */
.blk{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%;max-width:340px}
.blk-lbl{font-size:10px;color:var(--t3);letter-spacing:.18em;text-transform:uppercase}
.row{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}

/* pill toggle */
.pl{
  background:var(--s1);border:1px solid var(--b1);border-radius:100px;
  padding:7px 18px;font-size:13px;color:var(--t2);
  cursor:pointer;touch-action:manipulation;user-select:none;
  transition:border-color .12s,color .12s,background .12s;
}
.pl.on{border-color:var(--ac);color:var(--ac);background:rgba(200,200,200,.07)}
.pl:active{opacity:.65}

/* op pill */
.opl{
  background:var(--s1);border:1px solid var(--b1);border-radius:10px;
  width:54px;height:46px;font-family:'DM Mono',monospace;font-size:21px;
  color:var(--t2);cursor:pointer;text-align:center;line-height:46px;
  touch-action:manipulation;user-select:none;
  transition:border-color .12s,color .12s,background .12s;
}
.opl.on{border-color:var(--ac);color:var(--ac);background:rgba(200,200,200,.07)}
.opl:active{opacity:.65}

/* mode cards */
.mcards{display:flex;gap:12px;width:100%;max-width:340px}
.mcard{
  flex:1;background:var(--s1);border:1.5px solid var(--b1);border-radius:14px;
  padding:18px 10px;cursor:pointer;text-align:center;
  touch-action:manipulation;user-select:none;
  transition:border-color .12s,background .12s;
}
.mcard .ico{font-size:28px;line-height:1;margin-bottom:8px}
.mcard .nm{font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--t1)}
.mcard .ds{font-size:10px;color:var(--t2);margin-top:3px}
.mcard.on{border-color:var(--ac);background:rgba(200,200,200,.07)}
.mcard:active{opacity:.7}

/* buttons */
.btn{
  background:var(--ac);color:#fff;border:none;border-radius:12px;
  padding:15px 0;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:700;
  cursor:pointer;touch-action:manipulation;
  transition:opacity .12s,transform .1s;
  width:100%;max-width:280px;
}
.btn:active{opacity:.82;transform:scale(.98)}
.btn.ghost{background:none;border:1px solid var(--b2);color:var(--t2);font-weight:400}
.btn.ghost:active{opacity:.6}

/* result grid */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:310px}
.rbox{background:var(--s1);border:1px solid var(--b1);border-radius:12px;padding:14px;text-align:center}
.rval{font-family:'DM Mono',monospace;font-size:30px;font-weight:500;color:var(--t1);line-height:1}
.rlbl{font-size:10px;color:var(--t3);letter-spacing:.1em;margin-top:5px;text-transform:uppercase}

/* install hint */
/* ── GAME WRAP ── */
.wrap{width:100%;max-width:440px;display:flex;flex-direction:column;gap:9px;flex:1;min-height:0}

/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{font-family:'DM Mono',monospace;font-size:13px;color:var(--t3);letter-spacing:.1em}
.pts{font-family:'DM Mono',monospace;font-size:23px;font-weight:500;color:var(--t1)}
.mbtn{
  background:none;border:1px solid var(--b1);border-radius:8px;
  padding:5px 13px;font-size:11px;color:var(--t2);
  cursor:pointer;touch-action:manipulation;transition:opacity .12s;
}
.mbtn:active{opacity:.55}

/* streak */
.srow{display:flex;align-items:center;gap:7px;min-height:18px;flex-shrink:0}
.sdots{display:flex;gap:4px}
.dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--s2);border:1px solid var(--b1);
  transition:background .18s,border-color .18s;
}
.dot.on{background:var(--gn);border-color:var(--gn)}
.cmbo{margin-left:auto;font-size:11px;color:var(--ac);opacity:0;transition:opacity .2s;font-family:'DM Mono',monospace}
.cmbo.show{opacity:1}

/* question card */
.card{
  background:var(--s1);border:1px solid var(--b1);border-radius:16px;
  padding:20px 18px 16px;text-align:center;
  position:relative;overflow:hidden;flex-shrink:0;
  transition:border-color .18s,box-shadow .18s;
}
.card.ok{border-color:var(--gn)}
.card.err{border-color:var(--rd);animation:shk .24s}
@keyframes shk{0%,100%{transform:translateX(0)}30%{transform:translateX(-6px)}70%{transform:translateX(6px)}}

.qlbl{font-size:10px;color:var(--t3);letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px}

/* arithmetic */
.qarith{
  font-family:'DM Mono',monospace;
  font-size:clamp(28px,9.5vw,50px);font-weight:500;
  line-height:1;color:var(--t1);letter-spacing:-.02em;
}
.qarith .op{color:var(--ac)}
.qarith .eq{color:var(--t3)}

/* quadratic */
.qpoly{
  font-family:'DM Mono',monospace;
  font-size:clamp(18px,5.5vw,30px);font-weight:500;
  color:var(--t1);line-height:1.3;letter-spacing:.01em;
}
sup{font-size:.58em;vertical-align:super;line-height:0}
.qfact{
  font-family:'DM Mono',monospace;
  font-size:clamp(13px,4vw,20px);color:var(--t2);margin-top:10px;line-height:1.4;
}
.blnk{
  display:inline-block;min-width:20px;
  border-bottom:1.5px solid var(--ac);color:var(--ac);
  text-align:center;padding:0 2px;font-weight:500;letter-spacing:0;
}

/* floating score pop */
.pop{
  position:absolute;font-family:'DM Mono',monospace;font-size:19px;font-weight:500;
  pointer-events:none;opacity:0;z-index:5;
  top:50%;left:50%;transform:translate(-50%,-50%);white-space:nowrap;
}

/* ── ANSWER DISPLAYS ── */
/* arith */
.arow{display:flex;gap:8px;align-items:stretch;margin-bottom:8px}
.adisp{
  flex:1;background:var(--s2);border:1.5px solid var(--b1);border-radius:10px;
  padding:10px 14px;font-family:'DM Mono',monospace;font-size:26px;font-weight:500;
  color:var(--t1);text-align:right;min-height:52px;
  display:flex;align-items:center;justify-content:flex-end;
  user-select:none;cursor:default;letter-spacing:-.01em;
  transition:border-color .15s;
}
.adisp.mt{color:var(--t3)}

/* quad */
.qrow{display:flex;gap:6px;align-items:stretch;margin-bottom:8px}
.qfld{
  flex:1;background:var(--s2);border:1.5px solid var(--b1);border-radius:10px;
  padding:9px 12px;cursor:pointer;touch-action:manipulation;
  display:flex;flex-direction:column;gap:2px;transition:border-color .15s;
}
.qfld.act{border-color:var(--ac)}
.qflbl{font-size:9px;color:var(--t3);letter-spacing:.1em;text-transform:uppercase}
.qfval{
  font-family:'DM Mono',monospace;font-size:22px;font-weight:500;color:var(--t1);
  text-align:right;min-height:30px;display:flex;align-items:center;justify-content:flex-end;
}
.qfval.mt{color:var(--t3)}
.qsep{align-self:center;color:var(--t3);font-size:16px;flex-shrink:0}

/* ok button */
.okbtn{
  background:var(--s2);border:1.5px solid var(--b2);border-radius:10px;
  width:52px;min-height:52px;font-size:19px;cursor:pointer;flex-shrink:0;
  color:var(--t1);touch-action:manipulation;
  display:flex;align-items:center;justify-content:center;
  transition:background .1s,border-color .1s,transform .08s;
}
.okbtn:active{background:var(--ac);border-color:var(--ac);color:#fff;transform:scale(.93)}

/* ── NUMPAD ── */
.np{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.nk{
  background:var(--s1);border:1px solid var(--b1);border-radius:10px;
  padding:0;height:52px;
  font-family:'DM Mono',monospace;font-size:17px;font-weight:400;color:var(--t1);
  cursor:pointer;text-align:center;line-height:52px;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
  transition:background .07s,transform .07s;
}
.nk:active{transform:scale(.9);background:var(--s3)}
.nk.sign{color:var(--yl)}
.nk.del{color:var(--rd)}
.nk.z2{grid-column:span 2}
.nk.go{background:var(--ac);color:#fff;border-color:var(--ac);font-size:19px}
.nk.go:active{background:#6673e8;transform:scale(.9)}

/* quad field tabs */
.qtabs{display:flex;gap:6px;margin-bottom:5px}
.qtab{
  flex:1;background:var(--s1);border:1px solid var(--b1);border-radius:8px;
  padding:7px 0;font-size:11px;color:var(--t2);cursor:pointer;text-align:center;
  touch-action:manipulation;user-select:none;transition:all .12s;
  font-family:'DM Mono',monospace;letter-spacing:.04em;
}
.qtab.act{border-color:var(--ac);color:var(--ac);background:rgba(200,200,200,.07)}
.qtab:active{opacity:.65}

/* header message */
.hdr-msg{
  flex:1;font-family:'DM Mono',monospace;font-size:12px;
  color:var(--t2);text-align:center;padding:0 8px;
  min-height:18px;line-height:1.3;transition:color .2s;
}
.hdr-msg.ok{color:var(--gn)}
.hdr-msg.err{color:var(--rd)}

/* combo timer bar */
.ctimer-wrap{
  flex:1;height:3px;background:var(--s2);border-radius:2px;overflow:hidden;
  margin:0 4px;
}
.ctimer-bar{
  height:100%;width:100%;border-radius:2px;
  background:var(--ac);transform-origin:left;
  transition:background .3s;
}
.ctimer-bar.low{background:var(--rd)}

/* level-up toast */
.lup{
  position:fixed;top:24%;left:50%;transform:translateX(-50%);
  font-family:'DM Mono',monospace;font-size:clamp(16px,5vw,24px);
  color:var(--ac);opacity:0;pointer-events:none;z-index:60;white-space:nowrap;
}
@keyframes la{
  0%{opacity:0;transform:translateX(-50%) scale(.7)}
  20%{opacity:1;transform:translateX(-50%) scale(1.05)}
  70%{opacity:1;transform:translateX(-50%) scale(1)}
  100%{opacity:0;transform:translateX(-50%) scale(.88)}
}
.lup.show{animation:la 1.1s ease forwards}
</style>
</head>
<body>

<!-- ════════════════ MENU ════════════════ -->
<div class="scr" id="sMenu">
  <div class="ttl">mat-hub</div>

  <div class="mcards" id="modeCards">
    <div class="mcard on" data-m="arith">
      <div class="ico">±</div>
      <div class="nm">Działania</div>
    </div>
    <div class="mcard on" data-m="quad">
      <div class="ico">x²</div>
      <div class="nm">Rozkład</div>
    </div>
  </div>

  <div class="blk" id="arithOpts">
    <div class="blk-lbl">Działania</div>
    <div class="row" id="opPills">
      <div class="opl on" data-op="+">+</div>
      <div class="opl on" data-op="−">−</div>
      <div class="opl on" data-op="×">×</div>
      <div class="opl on" data-op="÷">÷</div>
    </div>
  </div>

  <div class="blk">
    <div class="blk-lbl">Poziom</div>
    <div class="row" id="diffPills">
      <div class="pl on" data-d="easy">Łatwy</div>
      <div class="pl" data-d="medium">Średni</div>
      <div class="pl" data-d="hard">Trudny</div>
    </div>
  </div>

  <button class="btn" id="btnStart">Graj</button>
</div>

<!-- ════════════════ WYNIKI ════════════════ -->
<div class="scr hide" id="sEnd">
  <div class="ttl" style="font-size:clamp(22px,7vw,34px)">wyniki</div>
  <div class="rgrid">
    <div class="rbox"><div class="rval" id="ePts">0</div><div class="rlbl">Punkty</div></div>
    <div class="rbox"><div class="rval" id="eAcc">—</div><div class="rlbl">Trafność</div></div>
    <div class="rbox"><div class="rval" id="eOk">0</div><div class="rlbl">Poprawne</div></div>
    <div class="rbox"><div class="rval" id="eBest">0</div><div class="rlbl">Max combo</div></div>
  </div>
  <div class="sub" id="eMsg" style="color:var(--yl)"></div>
  <button class="btn" id="btnAgain">Jeszcze raz</button>
  <button class="btn ghost" id="btnMenu">← Menu</button>
</div>

<!-- toast -->
<div class="lup" id="lup"></div>

<!-- ════════════════ GRA ════════════════ -->
<div class="wrap">

  <!-- nagłówek -->
  <div class="hdr">
    <div class="pts" id="gPts">0</div>
    <div class="hdr-msg" id="hdrMsg"></div>
    <button class="mbtn" id="btnBack">Menu</button>
  </div>

  <!-- streak dots + combo timer -->
  <div class="srow">
    <div class="sdots" id="sdots"></div>
    <div class="ctimer-wrap" id="ctimerWrap" style="display:none">
      <div class="ctimer-bar" id="ctimerBar"></div>
    </div>
    <div class="cmbo" id="cmbo"></div>
  </div>

  <!-- KARTA PYTANIA -->
  <div class="card" id="card">
    <div class="qlbl" id="qlbl"></div>

    <!-- widok arytmetyczny -->
    <div id="vA">
      <div class="qarith" id="qA"></div>
    </div>

    <!-- widok kwadratowy -->
    <div id="vQ" style="display:none">
      <div class="qpoly" id="qPoly"></div>
      <div class="qfact" id="qFact"></div>
    </div>

    <div class="pop" id="pop"></div>
  </div>

  <!-- ODPOWIEDŹ — arytmetyczna -->
  <div id="uiA">
    <div class="arow" style="display:block">
      <div class="adisp mt" id="aDisp">?</div>
    </div>
    <div class="np">
      <div class="nk" data-v="7">7</div>
      <div class="nk" data-v="8">8</div>
      <div class="nk" data-v="9">9</div>
      <div class="nk sign" data-v="-">±</div>
      <div class="nk" data-v="4">4</div>
      <div class="nk" data-v="5">5</div>
      <div class="nk" data-v="6">6</div>
      <div class="nk del" data-v="del">⌫</div>
      <div class="nk" data-v="1">1</div>
      <div class="nk" data-v="2">2</div>
      <div class="nk" data-v="3">3</div>
      <div class="nk del" data-v="clr">C</div>
      <div class="nk z2" data-v="0">0</div>
      <div class="nk go" data-v="ok">↵</div>
    </div>
  </div>

  <!-- ODPOWIEDŹ — kwadratowa -->
  <div id="uiQ" style="display:none">
    <div class="qtabs">
      <div class="qtab act" data-qf="0">x₁</div>
      <div class="qtab" data-qf="1">x₂</div>
    </div>
    <div class="qrow">
      <div class="qfld act" id="qf0">
        <div class="qflbl">x₁</div>
        <div class="qfval mt" id="qv0">?</div>
      </div>
      <div class="qsep">·</div>
      <div class="qfld" id="qf1">
        <div class="qflbl">x₂</div>
        <div class="qfval mt" id="qv1">?</div>
      </div>
    </div>
    <div class="np">
      <div class="nk" data-qv="7">7</div>
      <div class="nk" data-qv="8">8</div>
      <div class="nk" data-qv="9">9</div>
      <div class="nk" style="opacity:0;pointer-events:none" data-qv="">·</div>
      <div class="nk" data-qv="4">4</div>
      <div class="nk" data-qv="5">5</div>
      <div class="nk" data-qv="6">6</div>
      <div class="nk del" data-qv="del">⌫</div>
      <div class="nk" data-qv="1">1</div>
      <div class="nk" data-qv="2">2</div>
      <div class="nk" data-qv="3">3</div>
      <div class="nk del" data-qv="clr">C</div>
      <div class="nk z2" data-qv="0">0</div>
      <div class="nk go" data-qv="ok">↵</div>
    </div>
  </div>

</div><!-- /.wrap -->

<script>
/* ═══════════════════════════════════════════════════════
   KONFIGURACJA POZIOMÓW
   ═══════════════════════════════════════════════════════
   Rozkład kwadratowy:
     easy   — x²  (coef=1), znaki mieszane (+/+ lub −/−)
     medium — x², 2x², 3x²  (coef∈{1,2,3}), wszystkie 4 kombinacje znaków
     hard   — x², 2x², 3x², 5x²  (coef∈{1,2,3,5}), wszystkie kombinacje + podwójne pierwiastki
   ═══════════════════════════════════════════════════════ */
const CFG = {
  easy:  { ar:[1,12], mu:[1,10], dv:[1,10], qMax:7,  coef:[1],      negR:false, dbl:false },
  medium:{ ar:[1,20], mu:[1,12], dv:[1,12], qMax:10, coef:[1,2,3],  negR:true,  dbl:false },
  hard:  { ar:[1,30], mu:[2,15], dv:[2,15], qMax:12, coef:[1,2,3,5],negR:true,  dbl:true  },
};

/* ═══════════════════════════════════════════════════════
   STAN
   ═══════════════════════════════════════════════════════ */
const S = {
  pts:0, streak:0, best:0, ok:0, wrong:0,
  running:false,
  diff:'easy',
  ops:['+','−','×','÷'],
  modes:['arith','quad'],
  mul:1,
  mode:'arith',
  q:null,        // bieżące pytanie
  abuf:'',       // bufor arytmetyczny
  qbuf:['',''],  // bufory kwadratowe [x1, x2]
  qfocus:0,      // aktywne pole quad
};

/* ═══════════════════════════════════════════════════════
   DOM
   ═══════════════════════════════════════════════════════ */
const $  = id => document.getElementById(id);
const gPts=$('gPts'), card=$('card'), pop=$('pop'), qlbl=$('qlbl');
const hdrMsg=$('hdrMsg');
const sdots=$('sdots'), cmbo=$('cmbo'), lup=$('lup');
const vA=$('vA'),   uiA=$('uiA'),  qA=$('qA'),    aDisp=$('aDisp');
const vQ=$('vQ'),   uiQ=$('uiQ'),  qPoly=$('qPoly'), qFact=$('qFact');
const QFW=[$('qf0'),$('qf1')];
const QFV=[$('qv0'),$('qv1')];

// buduj 5 kropek streak
for(let i=0;i<5;i++){const d=document.createElement('div');d.className='dot';sdots.appendChild(d);}
const DOTS=[...sdots.querySelectorAll('.dot')];

/* ═══════════════════════════════════════════════════════
   POMOCNICY
   ═══════════════════════════════════════════════════════ */
const rnd  = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick = arr  => arr[Math.floor(Math.random()*arr.length)];
const ABS  = Math.abs;

/* ═══════════════════════════════════════════════════════
   GENEROWANIE PYTAŃ
   ═══════════════════════════════════════════════════════ */
function nextQ() {
  hdrMsg.textContent=''; hdrMsg.className='hdr-msg';
  const pool = S.modes.length ? S.modes : ['arith'];
  S.mode = pick(pool);
  if (S.mode === 'quad') genQuad();
  else genArith();
  vA.style.display  = S.mode==='arith' ? '' : 'none';
  vQ.style.display  = S.mode==='quad'  ? '' : 'none';
  uiA.style.display = S.mode==='arith' ? '' : 'none';
  uiQ.style.display = S.mode==='quad'  ? '' : 'none';
}

/* ── ARYTMETYKA ── */
function genArith() {
  const c = CFG[S.diff];
  const ops = S.ops.length ? S.ops : ['+'];
  const op = pick(ops);
  let a, b, ans;

  if (op==='+') {
    a=rnd(...c.ar); b=rnd(...c.ar); ans=a+b;
  } else if (op==='−') {
    a=rnd(...c.ar); b=rnd(...c.ar);
    if (b>a) [a,b]=[b,a];
    ans=a-b;
  } else if (op==='×') {
    a=rnd(...c.mu); b=rnd(...c.mu); ans=a*b;
  } else {
    // dzielenie — zawsze całkowite
    b=rnd(2,c.dv[1]); ans=rnd(1,c.dv[1]); a=b*ans;
  }

  S.q = { ans };
  S.abuf = '';
  qlbl.textContent = { '+':'Dodawanie','−':'Odejmowanie','×':'Mnożenie','÷':'Dzielenie' }[op];
  qA.innerHTML = `${a}<span class="op"> ${op} </span>${b}<span class="eq"> =</span>`;
  updA();
}

/* ── KWADRATOWE ──
   Logika (spójna, bez dwuznaczności):
   ─────────────────────────────────────
   Losujemy pierwiastki r1, r2 (gracz podaje te wartości).
   Wielomian:  (coef·a·x − r1)(coef·b·x − r2) ... NIE — prostsze:

   Postać:  coef·(x − r1)(x − r2) = 0
   Rozwinięcie:
     coef·x²  −  coef·(r1+r2)·x  +  coef·r1·r2  =  0

   Przy coef > 1 wyświetlamy np. 2x² − 6x + 4 = 0
   Postać iloczynowa podpowiedzi: coef·(x ± |r1|)(x ± |r2|)
     znak zależy od znaku r: jeśli r1 > 0 → (x − r1) → wyświetl "−"
                              jeśli r1 < 0 → (x + |r1|) → wyświetl "+"
                              jeśli r1 = 0 → (x)

   GRACZ WPISUJE: r1 i r2 (pierwiastki, ze znakiem jeśli ujemne)
   SPRAWDZENIE:   {v0, v1} == {r1, r2}  (w dowolnej kolejności)

   Przykłady:
     r1=3, r2=−2, coef=1:
       x² − x − 6 = 0
       (x − 3)(x + 2) = 0   → wpisujesz 3 i −2
     r1=−4, r2=−4, coef=2:
       2x² + 16x + 32 = 0
       2(x + 4)² = 0        → wpisujesz −4 i −4
*/
function genQuad() {
  const c = CFG[S.diff];
  const coef = pick(c.coef);

  // losuj r1
  let r1 = rnd(1, c.qMax) * (c.negR && Math.random()<.5 ? -1 : 1);

  // r2: przy hard 20% szans na r2=r1 (podwójny pierwiastek)
  let r2;
  if (c.dbl && Math.random() < 0.2) {
    r2 = r1;
  } else {
    r2 = rnd(1, c.qMax) * (c.negR && Math.random()<.5 ? -1 : 1);
  }

  // na easy: oba znaki losujemy niezależnie (ale tylko + lub −, nie 0)
  // upewniamy się że r≠0
  if (r1===0) r1=1;
  if (r2===0) r2=1;

  // współczynniki wielomianu: coef·x² + B·x + C = 0
  const B = -coef*(r1+r2);
  const C =  coef*r1*r2;

  S.q = { r1, r2, coef, B, C };
  S.qbuf   = ['',''];
  S.qfocus = 0;

  qlbl.textContent = 'Miejsca zerowe';
  qPoly.innerHTML  = buildPoly(coef, B, C);
  qFact.innerHTML  = buildFact(r1, r2, coef, false);
  updQfocus();
  updQdisplay();
}

/* buduje HTML wielomianu coef·x² + B·x + C = 0 */
function buildPoly(coef, B, C) {
  let s = '';

  // x² term
  if      (coef===1)  s += `x<sup>2</sup>`;
  else if (coef===-1) s += `−x<sup>2</sup>`;
  else                s += `${coef}x<sup>2</sup>`;

  // x term
  if (B !== 0) {
    const sg = B>0 ? '+' : '−';
    const av = ABS(B);
    s += ` <span style="color:var(--t2)">${sg}</span> `;
    s += av===1 ? `x` : `${av}x`;
  }

  // stała
  if (C !== 0) {
    const sg = C>0 ? '+' : '−';
    s += ` <span style="color:var(--t2)">${sg}</span> ${ABS(C)}`;
  }

  s += ` <span style="color:var(--t3)">= 0</span>`;
  return s;
}

/* buduje HTML postaci iloczynowej
   reveal=false → blanki z bieżącym wpisem gracza
   reveal=true  → poprawne wartości na zielono */
function buildFact(r1, r2, coef, reveal) {
  const pre = coef===1 ? '' : `${coef}`;

  function bracket(r, idx) {
    // (x − r) gdy r>0, (x + |r|) gdy r<0, (x) gdy r=0
    const sg   = r>0 ? '−' : (r<0 ? '+' : '');
    const val  = ABS(r);
    const term = val===0 ? '' : ` <span style="color:var(--t2)">${sg}</span> `;

    if (reveal) {
      const col = `style="color:var(--gn)"`;
      return `(x${val===0?'':`${term}<span ${col}>${val}</span>`})`;
    }

    const cur = S.qbuf[idx] !== '' ? S.qbuf[idx] : '?';
    return `(x${val===0?'':`${term}<span class="blnk" id="fb${idx}">${cur}</span>`})`;
  }

  const isDbl = (r1===r2);
  if (isDbl) {
    const b = bracket(r1, 0);
    const hint = reveal ? `<sup>2</sup>` : `·${bracket(r2, 1)}`;
    if (isDbl && reveal) {
      return `${pre}(x <span style="color:var(--t2)">${r1>0?'−':'+'}</span> <span style="color:var(--gn)">${ABS(r1)}</span>)<sup>2</sup> <span style="color:var(--t3)">= 0</span>`;
    }
    return `${pre}${bracket(r1,0)}·${bracket(r2,1)} <span style="color:var(--t3)">= 0</span>`;
  }

  return `${pre}${bracket(r1,0)}${bracket(r2,1)} <span style="color:var(--t3)">= 0</span>`;
}

/* ═══════════════════════════════════════════════════════
   AKTUALIZACJA WYŚWIETLACZY
   ═══════════════════════════════════════════════════════ */
function updA() {
  const v = S.abuf;
  aDisp.textContent  = v || '?';
  aDisp.className    = 'adisp' + (v ? '' : ' mt');
}

function updQdisplay() {
  for (let i=0; i<2; i++) {
    const v = S.qbuf[i];
    QFV[i].textContent = v || '?';
    QFV[i].className   = 'qfval' + (v ? '' : ' mt');
  }
  // odśwież blanki w podpowiedzi
  if (S.q) qFact.innerHTML = buildFact(S.q.r1, S.q.r2, S.q.coef, false);
}

function updQfocus() {
  for (let i=0; i<2; i++) QFW[i].className = 'qfld' + (S.qfocus===i ? ' act' : '');
  document.querySelectorAll('.qtab').forEach((t,i)=>t.classList.toggle('act', i===S.qfocus));
}

/* ═══════════════════════════════════════════════════════
   ZATWIERDZANIE
   ═══════════════════════════════════════════════════════ */
function submitA() {
  if (!S.running) return;
  const v = parseInt(S.abuf);
  if (S.abuf==='' || S.abuf==='-' || isNaN(v)) return;

  if (v === S.q.ans) {
    hit();
    setTimeout(()=>{ if(S.running) nextQ(); }, 170);
  } else {
    miss();
    showMsg(`Odpowiedź: ${S.q.ans}`, 'err');
    setTimeout(()=>{ if(S.running) nextQ(); }, 950);
  }
  S.abuf = ''; updA();
}

function submitQ() {
  if (!S.running) return;
  const v0 = parseInt(S.qbuf[0]);
  const v1 = parseInt(S.qbuf[1]);
  if (isNaN(v0) || isNaN(v1)) return;

  const { r1, r2, coef } = S.q;
  // Gracz wpisuje wartości BEZWZGLĘDNE pierwiastków — dokładnie to co widzi w nawiasach.
  // (x − 3)(x + 2) → wpisuje 3 i 2
  // (x + 12)(x + 4) → wpisuje 12 i 4
  const a0 = ABS(r1), a1 = ABS(r2);
  const ok = (v0===a0 && v1===a1) || (v0===a1 && v1===a0);

  if (ok) {
    hit();
    setTimeout(()=>{ if(S.running) nextQ(); }, 170);
  } else {
    miss();
    qFact.innerHTML  = buildFact(r1, r2, coef, true);
    showMsg(`wpisz: ${a0} i ${a1}`, 'err');
    setTimeout(()=>{ if(S.running) nextQ(); }, 1400);
  }
}

/* ═══════════════════════════════════════════════════════
   HIT / MISS / ANIMACJE
   ═══════════════════════════════════════════════════════ */
function hit() {
  S.streak++; S.ok++;
  if (S.streak > S.best) S.best = S.streak;
  S.mul = Math.floor(S.streak/5) + 1;
  const pts = (S.mode==='quad' ? 20 : 10) * S.mul;
  S.pts += pts;
  gPts.textContent = S.pts;
  anim('+'+pts, 'var(--gn)');
  flash('ok');
  updStreak();
  vib(22);
  if (S.streak>0 && S.streak%5===0) toast(`×${S.mul} combo`);
}

function miss() {
  S.wrong++; S.streak = 0; S.mul = 1;
  anim('✕', 'var(--rd)');
  flash('err');
  updStreak(); // wywoła stopComboTimer bo mul=1
  vib([40,15,40]);
}

function anim(txt, col) {
  pop.textContent = txt; pop.style.color = col;
  pop.style.transition = 'none';
  pop.style.opacity    = '1';
  pop.style.transform  = 'translate(-50%,-50%) scale(1)';
  requestAnimationFrame(()=>{
    pop.style.transition = 'opacity .48s, transform .48s';
    pop.style.opacity    = '0';
    pop.style.transform  = 'translate(-50%,-70%) scale(1.3)';
  });
}

function flash(cls) {
  card.classList.remove('ok','err');
  void card.offsetWidth;
  card.classList.add(cls);
  setTimeout(()=>card.classList.remove(cls), 290);
}

/* COMBO TIMER — 8 sekund, resetuje się przy trafieniu, kończy combo przy błędzie */
const COMBO_SEC = 8;
let _ctimerInt = null;
let _ctimerLeft = 0;

function startComboTimer() {
  clearInterval(_ctimerInt);
  _ctimerLeft = COMBO_SEC;
  $('ctimerWrap').style.display = '';
  $('ctimerBar').classList.remove('low');
  $('ctimerBar').style.transition = 'none';
  $('ctimerBar').style.width = '100%';
  _ctimerInt = setInterval(()=>{
    _ctimerLeft -= 0.1;
    const pct = Math.max(0, _ctimerLeft / COMBO_SEC * 100);
    $('ctimerBar').style.transition = 'width .1s linear';
    $('ctimerBar').style.width = pct + '%';
    if (_ctimerLeft <= 2) $('ctimerBar').classList.add('low');
    if (_ctimerLeft <= 0) {
      clearInterval(_ctimerInt);
      $('ctimerWrap').style.display = 'none';
      // combo wygasa — reset
      if (S.streak >= 5) {
        S.streak = 0; S.mul = 1;
        updStreak();
        showMsg('combo wygasło', 'err');
      }
    }
  }, 100);
}

function stopComboTimer() {
  clearInterval(_ctimerInt);
  $('ctimerWrap').style.display = 'none';
  $('ctimerBar').style.width = '100%';
}

function updStreak() {
  const p = S.streak % 5;
  DOTS.forEach((d,i)=>d.classList.toggle('on', i < (S.streak>0 && p===0 ? 5 : p)));
  if (S.mul >= 2) {
    cmbo.textContent=`×${S.mul}`;
    cmbo.classList.add('show');
    startComboTimer(); // odśwież timer przy każdym trafieniu w combo
  } else {
    cmbo.classList.remove('show');
    stopComboTimer();
  }
}

function showMsg(txt, cls) {
  hdrMsg.textContent = txt;
  hdrMsg.className = 'hdr-msg' + (cls ? ' '+cls : '');
  // auto-clear po chwili
  clearTimeout(hdrMsg._t);
  hdrMsg._t = setTimeout(()=>{ hdrMsg.textContent=''; hdrMsg.className='hdr-msg'; }, 2000);
}

function toast(msg) {
  lup.textContent = msg;
  lup.classList.remove('show');
  void lup.offsetWidth;
  lup.classList.add('show');
}

function vib(p) {
  try { if(navigator.vibrate) navigator.vibrate(p); } catch(_){}
}

/* ═══════════════════════════════════════════════════════
   FLOW GRY
   ═══════════════════════════════════════════════════════ */
function startGame() {
  $('sMenu').classList.add('hide');
  $('sEnd').classList.add('hide');
  Object.assign(S, {
    pts:0, streak:0, best:0, ok:0, wrong:0, mul:1,
    running:true, abuf:'', qbuf:['',''], qfocus:0
  });
  gPts.textContent = '0';
  DOTS.forEach(d=>d.classList.remove('on'));
  cmbo.classList.remove('show');
  stopComboTimer();
  hdrMsg.textContent=''; hdrMsg.className='hdr-msg';
  nextQ();
}

function showResults() {
  S.running = false;
  stopComboTimer();
  $('ePts').textContent  = S.pts;
  $('eOk').textContent   = S.ok;
  $('eBest').textContent = S.best;
  const tot = S.ok + S.wrong;
  $('eAcc').textContent  = tot ? Math.round(S.ok/tot*100)+'%' : '—';
  const msgs = [[0,'Ćwicz dalej!'],[80,'Nieźle!'],[200,'Świetnie!'],[450,'Rewelacja!'],[800,'Legenda! 🏆']];
  let m=''; for(const[t,msg] of msgs) if(S.pts>=t) m=msg;
  $('eMsg').textContent = m;
  $('sEnd').classList.remove('hide');
  vib([50,30,50,30,80]);
}

function goMenu() {
  S.running = false;
  $('sEnd').classList.add('hide');
  $('sMenu').classList.remove('hide');
}

/* ═══════════════════════════════════════════════════════
   OBSŁUGA WEJŚCIA — NUMPAD
   ═══════════════════════════════════════════════════════ */
function aKey(v) {
  if (!S.running || S.mode!=='arith') return;
  if (v==='ok')  { submitA(); return; }
  if (v==='clr') { S.abuf=''; updA(); return; }
  if (v==='del') { S.abuf=S.abuf.slice(0,-1); updA(); return; }
  if (v==='-') {
    if      (!S.abuf)           S.abuf = '-';
    else if (S.abuf==='-')      S.abuf = '';
    else if (S.abuf[0]==='-')   S.abuf = S.abuf.slice(1);
    else                         S.abuf = '-'+S.abuf;
    updA(); return;
  }
  if (S.abuf.replace('-','').length < 4) { S.abuf+=v; updA(); }
}

function qKey(v) {
  if (!S.running || S.mode!=='quad') return;
  if (v==='ok')  { submitQ(); return; }
  const f = S.qfocus;
  if (v==='clr') { S.qbuf[f]=''; updQdisplay(); return; }
  if (v==='del') { S.qbuf[f]=S.qbuf[f].slice(0,-1); updQdisplay(); return; }
  if (v==='-') return; // znaki są zakodowane w nawiasach — gracz wpisuje tylko |r|
  if (S.qbuf[f].length < 3) { S.qbuf[f]+=v; updQdisplay(); }
}

/* ═══════════════════════════════════════════════════════
   EVENTY
   ═══════════════════════════════════════════════════════ */
// numpad arytmetyczny
uiA.addEventListener('pointerdown', e=>{
  const b = e.target.closest('[data-v]');
  if (!b) return; e.preventDefault(); aKey(b.dataset.v);
});

// numpad kwadratowy
uiQ.addEventListener('pointerdown', e=>{
  const b = e.target.closest('[data-qv]');
  if (!b) return; e.preventDefault(); qKey(b.dataset.qv);
});

// pola quad + taby
[0,1].forEach(i=>{
  QFW[i].addEventListener('pointerdown', e=>{ e.preventDefault(); S.qfocus=i; updQfocus(); });
});
document.querySelectorAll('.qtab').forEach((t,i)=>{
  t.addEventListener('pointerdown', e=>{ e.preventDefault(); S.qfocus=i; updQfocus(); });
});

// przyciski nawigacji
$('btnStart').addEventListener('click', startGame);
$('btnAgain').addEventListener('click', startGame);
$('btnMenu').addEventListener('click', goMenu);
$('btnBack').addEventListener('click', showResults);

// konfiguracja: poziom
document.querySelectorAll('#diffPills .pl').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('#diffPills .pl').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    S.diff = b.dataset.d;
  });
});

// konfiguracja: operatory
document.querySelectorAll('#opPills .opl').forEach(b=>{
  b.addEventListener('click', ()=>{
    b.classList.toggle('on');
    const active = [...document.querySelectorAll('#opPills .opl.on')].map(x=>x.dataset.op);
    if (!active.length) { b.classList.add('on'); return; }
    S.ops = active;
  });
});

// konfiguracja: tryby gry
document.querySelectorAll('#modeCards .mcard').forEach(b=>{
  b.addEventListener('click', ()=>{
    b.classList.toggle('on');
    const active = [...document.querySelectorAll('#modeCards .mcard.on')].map(x=>x.dataset.m);
    if (!active.length) { b.classList.add('on'); return; }
    S.modes = active;
    $('arithOpts').style.display = (active.length===1 && active[0]==='quad') ? 'none' : '';
  });
});

// klawiatura fizyczna
document.addEventListener('keydown', e=>{
  if (!S.running) return;
  if (e.key>='0' && e.key<='9') {
    S.mode==='arith' ? aKey(e.key) : qKey(e.key);
  } else if (e.key==='-') {
    if (S.mode==='arith') aKey('-'); // quad nie używa znaku
  } else if (e.key==='Backspace') {
    e.preventDefault();
    S.mode==='arith' ? aKey('del') : qKey('del');
  } else if (e.key==='Enter' || e.key===' ') {
    e.preventDefault();
    S.mode==='arith' ? submitA() : submitQ();
  } else if (e.key==='Escape') {
    if (S.mode==='arith') { S.abuf=''; updA(); }
    else { S.qbuf[S.qfocus]=''; updQdisplay(); }
  } else if (e.key==='Tab' && S.mode==='quad') {
    e.preventDefault();
    S.qfocus = (S.qfocus+1)%2; updQfocus();
  }
});

/* ═══════════════════════════════════════════════════════
   PWA
   ═══════════════════════════════════════════════════════ */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

// hint instalacji — tylko gdy nie w trybie standalone
const isStandalone =
  window.matchMedia('(display-mode:standalone)').matches ||
  window.matchMedia('(display-mode:fullscreen)').matches ||
  navigator.standalone === true;
// blokuj multi-touch zoom
document.addEventListener('touchmove', e=>{ if(e.touches.length>1) e.preventDefault(); }, {passive:false});

// blokuj double-tap zoom (ale nie dla scrollowania menu)
let _lt = 0;
document.addEventListener('touchend', e=>{
  const now = Date.now();
  if (now - _lt < 280 && e.target.tagName!=='INPUT') e.preventDefault();
  _lt = now;
}, {passive:false});
</script>
